{{ define "main" }}
<div class="page">
  <div class="h-in">
    {{ partial "page-head.html" (dict "title" .Title "lead" (.Content | plainify | strings.TrimSpace)) }}
    <div class="post-list">
      {{ range .Pages }}
      <article class="post-item">
        <h2 class="post-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
        {{ with .Summary }}<p class="excerpt">{{ . | plainify }}</p>{{ end }}
      </article>
      {{ end }}
    </div>
  </div>
</div>
{{ end }}
