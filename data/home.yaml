faq:
  - q: "سازمان ما هنوز داده‌ی منظمی ندارد؛ آیا برای هوش مصنوعی زود است؟"
    a: "خیر. بیشتر پروژه‌ها از همین نقطه شروع می‌شوند. در مرحله‌ی ارزیابی مشخص می‌کنیم کدام داده‌ها آماده‌اند و چه کارهایی باید پیش از هوش مصنوعی انجام شود."
  - q: "آیا بدون دسترسی به سرویس‌های ابری خارجی می‌توان از هوش مصنوعی استفاده کرد؟"
    a: "بله. تمرکز من روی مدل‌های متن‌باز و زیرساخت خوداستقرار (self-hosted) است تا سامانه روی سرورهای خود سازمان و بدون وابستگی به سرویس‌های خارجی اجرا شود."
  - q: "هزینه‌ی همکاری چگونه تعیین می‌شود؟"
    a: "پس از جلسه‌ی آشنایی و ارزیابی اولیه، پیشنهاد مکتوبی شامل دامنه‌ی کار، زمان‌بندی و هزینه ارائه می‌کنم تا پیش از شروع، همه‌چیز روشن باشد."
  - q: "اطلاعات سازمان ما چگونه محافظت می‌شود؟"
    a: "محرمانگی اطلاعات در تمام مراحل همکاری رعایت می‌شود و در صورت نیاز، پیش از شروع کار قرارداد عدم افشا (NDA) امضا می‌کنیم."
  - q: "دوره‌های آموزشی چگونه برگزار می‌شوند؟"
    a: "دوره‌ها کاملاً فارسی و کاربردی‌اند و سرفصل آن‌ها بر اساس سطح تیم و نیاز سازمان شما طراحی می‌شود."

closing:
