eyebrow: "درخواست مشاوره"
title: "جلسه‌ی آشنایی رایگان ۲۰ دقیقه‌ای"
lead: >-
  در یک گفت‌وگوی کوتاه، نیاز سازمان شما بررسی می‌شود و مشخص می‌شود مشاوره، اجرای پروژه یا
  برگزاری دوره‌ی آموزشی کدام مناسب‌تر است. فرم زیر را پر کنید تا برای تعیین زمان جلسه با شما
  تماس گرفته شود.

