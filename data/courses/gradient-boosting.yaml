slug: gradient-boosting
en: "Gradient Boosting & XGBoost"
fa: "مدل‌های Gradient Boosting و XGBoost"
level: "متوسط تا پیشرفته"
summary: "تسلط بر الگوریتمی که در مسابقات برنده می‌شود و پشتوانه‌ی بسیاری از سامانه‌های واقعی روی داده‌های جدولی است: ساخت Gradient Boosting از پایه، شناخت کامل XGBoost و سپس تنظیم، تفسیر و استقرار یک مدل واقعی در پایتون."
project: "مدلی تنظیم‌شده و قابل تفسیر روی داده‌های واقعی"
outcomes:
  - "توضیح سازوکار Boosting با پیاده‌سازی Gradient Boosting از پایه در NumPy"
  - "آموزش، منظم‌سازی و اعتبارسنجی مدل‌های XGBoost روی داده‌های واقعی"
  - "مدیریت داده‌های نامتوازن و دسته‌ای بدون فریب‌خوردن از نتایج"
  - "تفسیر مدل با اهمیت ویژگی‌ها و SHAP و تنظیم آن با Optuna"
  - "ذخیره و استقرار مدل آموزش‌دیده"
prereqs:
  - "تسلط بر پایتون، NumPy و pandas"
  - "آشنایی با مبانی یادگیری نظارت‌شده: تقسیم داده‌ی آموزش و آزمون، بیش‌برازش و معیارهای ارزیابی"
tools: ["XGBoost", "scikit-learn", "NumPy", "SHAP", "Optuna"]
modules:
  - t: "مبانی Boosting"
    l: ["از درخت تصمیم تا Boosting", "سازوکار Gradient Boosting", "Gradient Boosting برای طبقه‌بندی", "توابع زیان و شبه‌باقیمانده‌ها", "پروژه‌ی راهنمادار: ساخت Boosting از پایه"]
  - t: "بررسی عمیق XGBoost"
    l: ["آشنایی با XGBoost", "درون تابع هدف XGBoost", "ابرپارامترهای اصلی", "منظم‌سازی و نمونه‌گیری", "پروژه‌ی راهنمادار: تنظیم XGBoost روی داده‌ی واقعی"]
  - t: "آموزش مدل‌های پایدار"
    l: ["توقف زودهنگام و مجموعه‌های ارزیابی", "اعتبارسنجی متقابل با xgb.cv", "مدیریت داده‌های نامتوازن", "مقادیر گمشده و ویژگی‌های دسته‌ای", "پروژه‌ی راهنمادار: یک جریان آموزش پایدار"]
  - t: "تفسیر، تنظیم و استقرار"
    l: ["اهمیت ویژگی‌ها و خطاهای رایج در تفسیر آن", "توضیح پیش‌بینی‌ها با SHAP", "تنظیم ابرپارامترها با Optuna", "ذخیره، استقرار و مقایسه‌ی کتابخانه‌ها", "پروژه‌ی راهنمادار: از مدل تا خروجی قابل استقرار"]
  - t: "پروژه‌ی پایانی"
    l: ["پروژه‌ی راهنمادار: مدلی صادقانه، تنظیم‌شده و قابل تفسیر"]
