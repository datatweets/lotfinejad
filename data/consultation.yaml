fit:
  title: "این جلسه برای چه کسانی مناسب است"
  items:
    - title: "مدیران و تصمیم‌گیران"
      desc: "که می‌خواهند بدانند هوش مصنوعی کجا برای سازمانشان ارزش واقعی ایجاد می‌کند و از کجا باید شروع کرد."
    - title: "مدیران فناوری و داده"
      desc: "که برای طراحی زیرساخت داده یا عملیاتی‌کردن یک سامانه‌ی هوش مصنوعی به نظر یک متخصص بیرونی نیاز دارند."
    - title: "مسئولان آموزش و منابع انسانی"
      desc: "که برای تیم‌های فنی سازمان، دوره‌ی آموزشی حضوری یا آنلاین در حوزه‌ی داده و هوش مصنوعی برنامه‌ریزی می‌کنند."

faq:
  - q: "جلسه‌ی آشنایی واقعاً رایگان است؟"
    a: "بله. این جلسه برای شناخت نیاز شماست و هیچ تعهدی ایجاد نمی‌کند. هزینه فقط در صورت توافق بر سر یک همکاری مشخص و پس از ارسال پیشنهاد مکتوب مطرح می‌شود."
  - q: "جلسه به چه شکل برگزار می‌شود؟"
    a: "جلسه به‌صورت آنلاین (تماس تصویری یا تلفنی) برگزار می‌شود. زمان آن پس از بررسی درخواست با شما هماهنگ می‌شود."
  - q: "اطلاعاتی که در فرم می‌نویسم محرمانه می‌ماند؟"
    a: "بله. اطلاعات فرم فقط برای پاسخ به درخواست شما استفاده می‌شود و در اختیار هیچ شخص یا سازمان دیگری قرار نمی‌گیرد."
  - q: "اگر هنوز دقیقاً نمی‌دانم به چه چیزی نیاز دارم چه کنم؟"
    a: "اشکالی ندارد. گزینه‌ی «سایر» را انتخاب کنید و وضعیت فعلی را به زبان ساده توضیح دهید؛ تعیین مسیر مناسب بخشی از همین جلسه است."
