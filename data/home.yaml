problems:
  title: "مشکلاتی که بیشتر سازمان‌ها با آن درگیرند"
  intro: "بسیاری از سازمان‌ها برای هوش مصنوعی وقت و هزینه گذاشته‌اند، اما هنوز نتیجه‌ی ملموسی از آن نگرفته‌اند."
  items:
    - title: "نمونه‌ای که هیچ‌وقت عملیاتی نمی‌شود"
      desc: "یک نسخه‌ی آزمایشی موفق ساخته شده، اما با داده‌ی واقعی، ملاحظات امنیتی، هزینه و حجم کار، به مرحله‌ی استفاده‌ی روزمره نمی‌رسد."
    - title: "داده‌های پراکنده و ناهماهنگ"
      desc: "داده‌ها در سامانه‌های مختلف پخش شده‌اند، کیفیت آن‌ها بررسی نمی‌شود و گزارش‌های واحدهای مختلف با هم نمی‌خوانند."
    - title: "وابستگی به سرویس‌های خارجی"
      desc: "دسترسی به سرویس‌های هوش مصنوعی خارجی پایدار نیست و سازمان به راهکاری نیاز دارد که روی سرورهای خودش اجرا شود."
    - title: "نبود تجربه‌ی اجرایی در تیم"
      desc: "تیم فنی با مفاهیم هوش مصنوعی آشناست، اما تجربه‌ی ساخت و نگهداری این سامانه‌ها را در مقیاس سازمانی ندارد."

