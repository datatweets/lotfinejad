slug: dbt-for-data-engineers
en: "dbt for Data Engineers"
fa: "مدل‌سازی داده با dbt"
level: "متوسط تا پیشرفته"
summary: "یادگیری عملی مهندسی تحلیل با dbt روی سیستم محلی: نصب dbt Core، راه‌اندازی انبار داده‌ی Postgres در Docker و تبدیل داده‌های واقعی سفر از لایه‌ی Staging تا آزمون و Martها."
project: "یک DAG کامل، آزموده و مستند در dbt برای تبدیل داده‌های سفر CityFlow روی Postgres و DuckDB، با استقرار و زمان‌بندی در Airflow"
outcomes:
  - "نصب و اجرای dbt Core روی یک انبار داده‌ی واقعی Postgres در Docker"
  - "ساخت مدل‌های Staging، میانی و Mart که با ref()‎ و source()‎ به هم پیوند خورده‌اند"
  - "آزمون و مستندسازی داده با آزمون‌های عمومی، اختصاصی و واحد dbt"
  - "ساخت مدل‌های افزایشی و Snapshot و زمان‌بندی dbt با Airflow"
prereqs:
  - "نیازی به تجربه‌ی قبلی dbt نیست؛ دوره از اولین مدل شروع می‌شود"
  - "تسلط بر SQL (SELECT، JOIN و GROUP BY)"
  - "آشنایی با خط فرمان"
  - "Docker Desktop (نصب آن در بخش ۱ آموزش داده می‌شود)"
tools: ["dbt Core", "Docker", "Postgres", "Python", "Airflow"]
modules:
  - t: "آشنایی با مهندسی تحلیل"
    l: ["مهندسی تحلیل در واقع چیست", "dbt Core، dbt Cloud و گذار به Fusion", "راه‌اندازی انبار داده", "اولین مدل", "پروژه‌ی راهنمادار: بارگذاری داده‌های سفر CityFlow در انبار داده"]
  - t: "مدل‌ها، DAG و Materialization"
    l: ["ref()‎ و source()‎: ساخت گراف وابستگی", "انواع Materialization: View، Table و Ephemeral", "DAG، فرمان dbt build و اجرای انتخابی", "انبار داده‌ی دوم با همان SQL", "پروژه‌ی راهنمادار: بازسازی اولین مدل CityFlow به‌صورت یک DAG واقعی"]
  - t: "منابع داده و مدل‌های Staging"
    l: ["تعریف منابع داده", "تازگی داده‌های منبع", "لایه‌ی Staging در عمل", "Staging داده‌های سفر CityFlow", "پروژه‌ی راهنمادار: یک لایه‌ی Staging کامل"]
  - t: "آزمون داده"
    l: ["چرا یک کوئری SQL را آزمون کنیم؟", "چهار آزمون عمومی داخلی", "آزمون‌های اختصاصی", "dbt_utils و مدیریت بسته‌ها", "پروژه‌ی راهنمادار: لایه‌ی Staging آزموده"]
  - t: "مدل‌های میانی و Martها"
    l: ["لایه‌ی میانی", "مدل‌سازی جدول‌های واقعیت و بُعد در dbt", "ساخت بُعد منطقه‌ی CityFlow", "ساخت جدول واقعیت سفرهای CityFlow", "پروژه‌ی راهنمادار: گزارش منطقه–ساعت در dbt"]
  - t: "Jinja و ماکروها"
    l: ["Jinja در SQL", "کنترل جریان با For و If", "نوشتن ماکروی اختصاصی", "ماکروهای dbt_utils", "پروژه‌ی راهنمادار: حذف تکرار از مدل‌های CityFlow"]
  - t: "مدل‌های افزایشی"
    l: ["چرا بازسازی کامل در مقیاس بزرگ جواب نمی‌دهد", "Materialization افزایشی", "راهبردهای افزایشی", "unique_key و داده‌های دیررس", "پروژه‌ی راهنمادار: جدول واقعیت سفرهای CityFlow به‌صورت افزایشی"]
  - t: "Snapshot و ابعاد با تغییر کند"
    l: ["مسئله‌ای که Snapshot حل می‌کند", "Snapshot در dbt با نگارش جدید", "راهبرد زمان‌محور در برابر بررسی‌محور", "کوئری روی وضعیت تاریخی", "پروژه‌ی راهنمادار: Snapshot از بُعد منطقه‌ی CityFlow"]
  - t: "مستندسازی و سایت مستندات dbt"
    l: ["مستندسازی مدل‌ها و ستون‌ها", "فرمان‌های dbt docs generate و dbt docs serve", "خواندن گراف تبارنامه‌ی داده", "Exposureها", "پروژه‌ی راهنمادار: پوشش کامل مستندات"]
  - t: "آزمون واحد و آزمون پیشرفته"
    l: ["آزمون داده در برابر آزمون واحد", "نوشتن آزمون واحد در dbt", "آزمون حالت‌های مرزی بدون داده‌ی واقعی", "ترتیب کامل اجرای dbt build", "پروژه‌ی راهنمادار: آزمون واحد یک ماکروی واقعی CityFlow"]
  - t: "استقرار، CI و الگوهای عملیاتی"
    l: ["محیط‌ها و Targetها", "انتخاب مبتنی بر وضعیت", "dbt در CI", "زمان‌بندی dbt با Airflow", "پروژه‌ی راهنمادار: به‌روزرسانی زمان‌بندی‌شده‌ی CityFlow"]
  - t: "پروژه‌ی پایانی"
    l: ["پروژه‌ی پایانی: انبار داده‌ی تحلیلی شرکت CityFlow"]
