slug: llm-evaluation
en: "LLM Evaluation & Observability"
fa: "ارزیابی و پایش مدل‌های زبانی"
level: "متوسط"
summary: "طراحی روند ارزیابی و پایش کاربردهای مبتنی بر مدل‌های زبانی؛ شامل مجموعه‌داده و معیارهای ارزیابی، داوری با مدل زبانی، ارزیابی RAG و ایجنت‌ها، ردگیری و پایش عملیاتی."
project: "سامانه‌ی ارزیابی و پایش برای یک اپلیکیشن مبتنی بر مدل زبانی"
outcomes:
  - "توضیح اینکه چرا «ظاهراً درست کار می‌کند» دلیلی بر کارکرد درست یک قابلیت هوش مصنوعی نیست"
  - "ساخت مجموعه‌داده‌ی مرجع که بازتاب استفاده‌ی واقعی باشد"
  - "انتخاب میان معیارهای قطعی، مبتنی بر پاسخ مرجع و داوری با مدل زبانی"
  - "ارزیابی تخصصی جریان‌های RAG و ایجنت‌های ابزارمحور"
  - "ردگیری، پایش و محافظت از اپلیکیشن مبتنی بر مدل زبانی در محیط عملیاتی"
prereqs:
  - "تسلط بر پایتون"
  - "تجربه‌ی ساخت یا کار روی یک اپلیکیشن مبتنی بر مدل زبانی؛ این دوره ارزیابی آن را آموزش می‌دهد، نه ساخت اولین اپلیکیشن"
  - "دسترسی به API یک مدل زبانی برای تمرین‌های عملی"
tools: ["Anthropic SDK (Claude)", "Pydantic", "ROUGE & NLTK", "scikit-learn"]
modules:
  - t: "چرا ارزیابی اهمیت دارد"
    l: ["دام «ظاهراً درست است»", "ارزیابی آفلاین در برابر آنلاین", "نگرش ارزیابی‌محور", "چه چیزی را بسنجیم: ابعاد کیفیت", "پروژه‌ی راهنمادار: اولین سامانه‌ی ارزیابی"]
  - t: "ساخت مجموعه‌داده‌ی ارزیابی"
    l: ["مجموعه‌ی مرجع: ویژگی‌های یک مجموعه‌داده‌ی ارزیابی خوب", "نوشتن دستی موارد آزمون", "از گزارش‌های عملیاتی تا مجموعه‌ی آزمون", "پوشش، تفکیک و پاکیزگی مجموعه‌داده", "پروژه‌ی راهنمادار: ساخت مجموعه‌ی مرجع برای Docent"]
  - t: "معیارهای قطعی و مبتنی بر پاسخ مرجع"
    l: ["تطابق دقیق و یکسان‌سازی", "F1 در سطح توکن و معیارهای هم‌پوشانی", "معیارهای ROUGE، BLEU و N-gram", "بررسی خروجی ساختاریافته و Schema", "پروژه‌ی راهنمادار: کارنامه‌ی معیارهای مرجع"]
  - t: "داوری با مدل زبانی (LLM-as-Judge)"
    l: ["چرا و چه زمانی از مدل زبانی به‌عنوان داور استفاده کنیم", "امتیازدهی مستقیم با سنجه‌نامه", "مقایسه‌ی دوبه‌دو و ترجیح", "واسنجی داور و اعتماد به آن", "پروژه‌ی راهنمادار: داور واسنجی‌شده برای Docent"]
  - t: "ارزیابی RAG"
    l: ["مسئله‌ی ارزیابی RAG: دو سامانه در یک سامانه", "معیارهای بازیابی: Precision، Recall، MRR و NDCG", "وفاداری به منبع و مستندبودن پاسخ", "مرتبط‌بودن پاسخ و کیفیت زمینه", "پروژه‌ی راهنمادار: ارزیابی کامل یک RAG"]
  - t: "ارزیابی ایجنت‌ها و به‌کارگیری ابزار"
    l: ["چرا ارزیابی ایجنت‌ها دشوارتر است", "معیارهای موفقیت در انجام وظیفه و نتیجه", "درستی فراخوانی ابزار", "ارزیابی مسیر حرکت ایجنت", "پروژه‌ی راهنمادار: ارزیابی نسخه‌ی ایجنتیک Docent"]
  - t: "پایش‌پذیری و ردگیری"
    l: ["از ارزیابی تا پایش‌پذیری", "ثبت ساختاریافته‌ی فراخوانی‌های مدل", "Trace و Span: دنبال‌کردن یک درخواست", "حسابرسی هزینه، تأخیر و توکن", "پروژه‌ی راهنمادار: ابزارگذاری Docent برای پایش"]
  - t: "پایش در محیط عملیاتی و سازوکارهای محافظتی"
    l: ["پایش در محیط عملیاتی: داشبورد و هشدار", "تشخیص رانش و افت عملکرد", "آزمون پسرفت پرامپت و مدل در CI", "سازوکارهای محافظتی و بازخورد انسانی", "پروژه‌ی راهنمادار: سامانه‌ی پایش و محافظت"]
  - t: "پروژه‌ی پایانی"
    l: ["پروژه‌ی راهنمادار: سامانه‌ی کامل ارزیابی و پایش"]
