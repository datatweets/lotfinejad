# FAQ on the About page. Shown on the page AND emitted as FAQPage JSON-LD,
# so the visible text and the structured data must stay identical (both
# come from this file). Written to answer the name-based questions people
# actually search for, using only facts stated elsewhere on the site.
faq:
  - q: "محمدمهدی لطفی نژاد کیست؟"
    a: "محمدمهدی لطفی نژاد مشاور و مدرس داده و هوش مصنوعی با بیش از ۱۵ سال تجربه در مهندسی داده، یادگیری ماشین و مدل‌های زبانی بزرگ است. او پروژه‌های داده و هوش مصنوعی را در سازمان‌هایی مانند CIMB، Petronas، Shell، TNB و Axiata هدایت کرده است و با نام‌های مهدی لطفی نژاد و Mehdi Lotfinejad نیز شناخته می‌شود."
  - q: "تخصص محمدمهدی لطفی نژاد چیست؟"
    a: "حوزه‌های تخصص شامل هوش مصنوعی، RAG، ایجنت‌ها، ارزیابی مدل‌های زبانی، مهندسی داده و رهبری فنی است. در طراحی راهکار، مدل‌های متن‌باز و امکان اجرا روی زیرساخت سازمان نیز بررسی می‌شوند."
  - q: "آیا محمدمهدی لطفی نژاد مشاوره‌ی هوش مصنوعی و داده ارائه می‌دهد؟"
    a: "بله. خدمات مشاوره، طراحی و پیاده‌سازی پلتفرم‌های داده و سامانه‌های هوش مصنوعی برای سازمان‌ها ارائه می‌شود. شرح خدمات و امکان درخواست جلسه در صفحه‌ی خدمات در دسترس است."
  - q: "آیا محمدمهدی لطفی نژاد دوره‌ی آموزشی هوش مصنوعی برگزار می‌کند؟"
    a: "بله. دوره‌های داده و هوش مصنوعی به زبان فارسی و به‌صورت حضوری یا آنلاین برای تیم‌های فنی برگزار می‌شود. فهرست دوره‌ها و سرفصل‌ها در صفحه‌ی دوره‌ها آمده است."
  - q: "رزومه‌ی محمدمهدی لطفی نژاد کجا قابل مشاهده است؟"
    a: "رزومه‌ی کامل او، شامل سوابق کاری، تحصیلات، گواهی‌نامه‌ها و انتشارات، در صفحه‌ی رزومه و به‌صورت PDF در دسترس است."
