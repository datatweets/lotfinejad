slug: scaling-python-for-data-engineering
en: "Scaling Python for Data Engineering"
fa: "پایتون مقیاس‌پذیر برای مهندسی داده"
level: "مقدماتی تا متوسط"
summary: "آموزش پردازش داده‌های بزرگ‌تر از حافظه با پایتون؛ شامل مدیریت مصرف حافظه، بارگذاری هدفمند، پردازش تکه‌ای و موازی‌سازی، همراه با تمرین روی داده‌های واقعی تاکسی نیویورک."
project: "یک جریان پردازش برای داده‌های بزرگ‌تر از حافظه روی داده‌های تاکسی نیویورک"
outcomes:
  - "اندازه‌گیری هزینه‌ی واقعی داده در حافظه و کاهش آن با انتخاب نوع داده‌ی مناسب"
  - "بارگذاری فقط داده‌ی موردنیاز و پردازش تکه‌تکه‌ی داده‌های بزرگ‌تر از حافظه"
  - "استفاده از NumPy و pandas در مقیاسی که کد ساده دیگر جواب نمی‌دهد"
  - "موازی‌سازی پردازش روی چند هسته‌ی پردازنده"
  - "انتخاب ساختمان‌های داده‌ای که جریان‌های واقعی بر پایه‌ی آن‌ها ساخته می‌شوند"
prereqs:
  - "تسلط بر پایتون"
  - "آشنایی کاربردی با مبانی pandas: خواندن CSV، انتخاب ستون، گروه‌بندی و تجمیع"
tools: ["Python 3", "pandas", "NumPy", "PyArrow"]
modules:
  - t: "وقتی داده از حافظه بزرگ‌تر می‌شود"
    l: ["دیوار حافظه", "سنجش مصرف حافظه و انواع داده", "جعبه‌ابزار مهندس داده", "بارگذاری فقط داده‌ی موردنیاز", "پروژه‌ی راهنمادار: بررسی داده‌های تاکسی نیویورک"]
  - t: "NumPy برای مهندسی داده"
    l: ["چرا NumPy", "نوع داده، دقت و حافظه", "برداری‌سازی: از حلقه تا عملیات آرایه‌ای", "انتشار (Broadcasting)", "پروژه‌ی راهنمادار: شاخص‌های سفر با NumPy"]
  - t: "pandas در مقیاس بزرگ"
    l: ["کاهش اندازه‌ی نوع داده‌های عددی", "داده‌های دسته‌ای (Categorical)", "عملیات کارآمد و پرهیز از کپی‌های اضافه", "گروه‌بندی و تجمیع سریع", "پروژه‌ی راهنمادار: بارگذار کم‌مصرف داده‌های تاکسی"]
  - t: "پردازش تکه‌تکه و فراتر از حافظه"
    l: ["ایده‌ی تکه‌بندی داده", "تجمیع جریانی", "SQLite به‌عنوان انبار داده‌ی محلی", "جریان‌های پردازش افزایشی و قابل ازسرگیری", "پروژه‌ی راهنمادار: تجمیع داده‌ی چندماهه‌ای که در حافظه جا نمی‌شود"]
  - t: "پردازش موازی"
    l: ["چرا موازی‌سازی (و قفل سراسری مفسر)", "multiprocessing و Process Pool", "الگوی MapReduce", "پردازش موازی تکه‌های داده", "پروژه‌ی راهنمادار: تجمیع موازی همراه با اندازه‌گیری"]
  - t: "ساختمان‌های داده برای کار با داده"
    l: ["دیکشنری و مجموعه: جست‌وجوی O(1) و حذف تکراری‌ها", "پشته و صف", "هیپ و صف اولویت", "انتخاب ساختار مناسب", "پروژه‌ی راهنمادار: ایندکس درون‌حافظه‌ای و Top-N"]
  - t: "بازگشت و درخت"
    l: ["بازگشت برای پردازش داده", "درخت جست‌وجوی دودویی", "درخت برای مرتب‌سازی و ادغام", "ایندکس‌گذاری یک فایل", "پروژه‌ی راهنمادار: ایندکس بازه‌ی زمانی روی داده‌های تاکسی"]
  - t: "پروژه‌ی پایانی"
    l: ["پروژه‌ی پایانی: جریان تحلیلی برای داده‌های بزرگ‌تر از حافظه"]
