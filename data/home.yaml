problems:
  title: "چالش‌های رایج در به‌کارگیری هوش مصنوعی"
  intro: "برای بهره‌مندی از هوش مصنوعی، راهکار باید با داده، فرایندها و الزامات عملیاتی سازمان سازگار باشد."
  items:
    - title: "فاصله‌ی نمونه‌ی آزمایشی تا بهره‌برداری"
      desc: "نمونه‌ی اولیه با داده‌ی واقعی، الزامات امنیتی، هزینه و حجم عملیاتی سازگار نیست و به استفاده‌ی روزمره نمی‌رسد."
    - title: "داده‌های پراکنده و ناهماهنگ"
      desc: "داده‌ها در سامانه‌های مختلف نگهداری می‌شوند، کیفیت آن‌ها یکپارچه ارزیابی نمی‌شود و گزارش واحدها هم‌خوانی ندارد."
    - title: "وابستگی به سرویس‌های خارجی"
      desc: "محدودیت دسترسی یا محرمانگی داده، استفاده از سرویس‌های بیرونی را دشوار می‌کند و راهکار قابل‌استقرار در زیرساخت سازمان را ضروری می‌سازد."
    - title: "نبود تجربه‌ی اجرایی در تیم"
      desc: "تیم فنی با مفاهیم هوش مصنوعی آشناست، اما برای توسعه و نگهداری سامانه در مقیاس سازمانی به تجربه‌ی اجرایی نیاز دارد."

