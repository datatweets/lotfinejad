slug: ai-agents
en: "Building AI Agents in Python"
fa: "ساخت ایجنت‌های هوش مصنوعی با پایتون"
level: "متوسط"
summary: "آموزش طراحی و پیاده‌سازی ایجنت‌های هوش مصنوعی با پایتون؛ شامل به‌کارگیری ابزار، مدیریت حافظه و وضعیت، برنامه‌ریزی، بازیابی اطلاعات و همکاری چندایجنتی، همراه با بررسی مسیر استقرار سازمانی."
project: "Atlas؛ یک ایجنت هوش مصنوعی چندابزاری"
outcomes:
  - "پیاده‌سازی و ارزیابی چرخه‌ی اجرای ایجنت"
  - "طراحی ابزارهایی که ایجنت بتواند با اطمینان از آن‌ها استفاده کند و مدیریت خطاهای آن‌ها"
  - "طراحی حافظه و مدیریت وضعیت ماندگار برای ایجنت"
  - "افزودن برنامه‌ریزی، بازبینی و بازیابی اطلاعات برای بهبود نتایج"
  - "هماهنگ‌سازی چند ایجنت و ارزیابی عملکرد سامانه‌ی چندایجنتی"
  - "تبدیل یک ایجنت کارا به طرح اجرایی قابل دفاع در سازمان: فرصت، بستر فنی، هزینه، حاکمیت و شاخص‌های عملکرد"
prereqs:
  - "تسلط بر پایتون، از جمله کلاس‌ها و مبانی برنامه‌نویسی ناهمگام"
  - "تجربه‌ی کار با API مدل‌های زبانی (مطالب دوره‌ی «هوش مصنوعی مولد» کافی است)"
  - "دسترسی به API یک مدل زبانی برای تمرین‌های عملی"
tools: ["Anthropic SDK (Claude)", "Pydantic", "sentence-transformers"]
modules:
  - t: "مبانی ایجنت"
    l: ["ایجنت چیست؟", "ایجنت در برابر جریان کار از پیش تعریف‌شده", "اجزای یک ایجنت", "اولین فراخوانی مدل", "پروژه‌ی راهنمادار: طراحی ایجنت Atlas"]
  - t: "حلقه‌ی ایجنت"
    l: ["به‌کارگیری ابزار توسط مدل", "مدیریت درخواست‌ها و نتایج ابزار", "ساخت حلقه‌ی ایجنت", "خطاها، ابزارهای موازی و شرایط توقف", "پروژه‌ی راهنمادار: اولین حلقه‌ی ابزار Atlas"]
  - t: "طراحی ابزار"
    l: ["ویژگی‌های یک ابزار خوب", "اعتبارسنجی ورودی‌ها با Pydantic", "خطاها و حلقه‌ی اصلاح", "الگوهای طراحی ابزار", "پروژه‌ی راهنمادار: ابزارهای پایدار برای Atlas"]
  - t: "حافظه و وضعیت"
    l: ["فهرست پیام‌ها همان حافظه است", "مدیریت زمینه: کوتاه‌سازی و بودجه‌بندی", "حافظه‌ی مبتنی بر خلاصه‌سازی", "حافظه‌ی بلندمدت با پایگاه داده‌ی برداری", "پروژه‌ی راهنمادار: افزودن حافظه به Atlas"]
  - t: "برنامه‌ریزی و استدلال"
    l: ["چرا ایجنت‌ها باید برنامه‌ریزی کنند", "تجزیه‌ی وظایف", "الگوی ReAct: استدلال و اقدام", "بازبینی و خوداصلاحی", "پروژه‌ی راهنمادار: Atlas با قابلیت برنامه‌ریزی و استدلال"]
  - t: "ایجنت‌های مبتنی بر بازیابی اطلاعات"
    l: ["چرا ایجنت‌ها به بازیابی اطلاعات نیاز دارند", "ساخت پایگاه دانش", "بازیابی به‌عنوان یک ابزار", "پاسخ مستند و ارجاع به منبع", "پروژه‌ی راهنمادار: Atlas مجهز به بازیابی اطلاعات"]
  - t: "سامانه‌های چندایجنتی"
    l: ["چرا و چه زمانی از چند ایجنت استفاده کنیم", "ایجنت‌ها به‌عنوان ابزار", "مسیریابی وظایف", "الگوی هماهنگ‌کننده و کارگزاران", "پروژه‌ی راهنمادار: Atlas چندایجنتی"]
  - t: "پایداری و ارزیابی"
    l: ["چرا پایداری و ارزیابی اهمیت دارد", "سازوکارهای محافظتی (Guardrails)", "تلاش مجدد، محدودیت زمانی و کنترل هزینه", "ارزیابی ایجنت‌ها", "پروژه‌ی راهنمادار: Atlas آماده‌ی محیط عملیاتی"]
  - t: "کسب‌وکار، حاکمیت و اجرا در سازمان"
    l: ["اصطلاحات هوش مصنوعی ایجنتیک و نقشه‌ی سطوح خودمختاری", "فرصت‌های به‌کارگیری ایجنت و ارزش کسب‌وکاری", "بستر فنی، معماری و اقتصاد هوش مصنوعی", "هزینه، ارزش و امکان‌پذیری", "جریان‌های کاری، بوم‌سازگان دیجیتال و یکپارچه‌سازی", "نقشه‌ی یکپارچه‌سازی و سطح اختیارات", "مدل‌سازی تهدیدهای امنیتی ایجنت", "اطلاعات نادرست و واکنش به رخدادها", "ایجنت‌ها در واحدهای مختلف کسب‌وکار", "نقش‌های سازمانی و آمادگی برای تغییر", "اجرای محدود، شاخص‌های عملکرد و نقاط تصمیم", "کارنامه‌ی ارزیابی اجرای اولیه در عمل", "حاکمیت، امنیت و پاسخ‌گویی", "پروژه‌ی راهنمادار: پرونده‌ی کامل طرح اجرای ایجنت هوش مصنوعی"]
