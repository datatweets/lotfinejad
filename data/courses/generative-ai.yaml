slug: generative-ai
en: "Generative AI & LLM Engineering"
fa: "هوش مصنوعی مولد و مهندسی مدل‌های زبانی بزرگ"
level: "متوسط"
summary: "آموزش توسعه‌ی کاربردهای مدل‌های زبانی بزرگ با پایتون؛ شامل طراحی پرامپت، به‌کارگیری ابزار، پروتکل MCP، بردارهای معنایی، RAG و ایجنت‌های هوش مصنوعی."
project: "ابزارها، اپلیکیشن‌های RAG و ایجنت‌های هوش مصنوعی"
outcomes:
  - "فراخوانی مدل زبانی از پایتون و دریافت خروجی ساختاریافته و قابل‌اعتماد"
  - "طراحی آگاهانه‌ی پرامپت به‌جای آزمون و خطا"
  - "دادن ابزار به مدل از طریق فراخوانی تابع و پروتکل MCP"
  - "ساخت RAG روی اسناد سازمان با بردارهای معنایی و پایگاه داده‌ی برداری"
  - "ساخت اپلیکیشن با LangChain و LangGraph و آماده‌سازی آن برای استفاده‌ی واقعی"
prereqs:
  - "تسلط بر پایتون: تابع، دیکشنری و نصب بسته‌ها"
  - "دسترسی به API یک مدل زبانی برای تمرین‌های عملی (قابل تطبیق با مدل‌های متن‌باز)"
tools: ["Anthropic SDK (Claude)", "LangChain & LangGraph", "Chroma", "MCP SDK", "FastAPI"]
modules:
  - t: "کار با مدل‌های زبانی در پایتون"
    l: ["مدل‌های زبانی بزرگ چگونه کار می‌کنند", "اولین فراخوانی مدل", "پرامپت سیستمی و نقش‌ها", "گفت‌وگوهای چندمرحله‌ای", "توکن، هزینه و پاسخ جریانی", "کنترل خروجی", "پروژه‌ی راهنمادار: دستیار خط فرمان"]
  - t: "مهندسی پرامپت"
    l: ["اجزای یک پرامپت قوی", "تکنیک‌های دقیق‌سازی پرامپت", "پرامپت با چند نمونه و تعیین نقش", "خروجی ساختاریافته‌ی قابل‌اعتماد", "پرامپت‌نویسی برای کارهای داده‌ای", "ارزیابی و بهبود پرامپت‌ها", "کاهش توهم و خروجی ناایمن", "پروژه‌ی راهنمادار: جعبه‌ابزار پرامپت قابل استفاده‌ی دوباره"]
  - t: "به‌کارگیری ابزار و فراخوانی تابع"
    l: ["چرا مدل‌های زبانی به ابزار نیاز دارند", "تعریف ابزار و Schema", "حلقه‌ی به‌کارگیری ابزار", "ابزارهای موازی، خطاها و Schemaهای سخت‌گیرانه", "پروژه‌ی راهنمادار: ایجنت چندابزاری برای جریان کار"]
  - t: "پروتکل Model Context Protocol (MCP)"
    l: ["MCP چیست و چرا اهمیت دارد", "اتصال به سرورهای MCP", "ساخت ابزار روی MCP", "پروژه‌ی راهنمادار: اتصال مدل به یک سرویس MCP"]
  - t: "بردارهای معنایی و جست‌وجوی معنایی"
    l: ["بردار معنایی (Embedding) چیست", "تولید بردارهای معنایی", "سنجش شباهت و فاصله", "پروژه‌ی راهنمادار: جست‌وجوی معنایی"]
  - t: "پایگاه‌های داده‌ی برداری"
    l: ["چرا پایگاه داده‌ی برداری", "شروع کار با Chroma", "فراداده و فیلتر", "پروژه‌ی راهنمادار: پایگاه دانش قابل جست‌وجو"]
  - t: "تولید افزوده با بازیابی (RAG)"
    l: ["RAG چیست", "ساخت جریان RAG", "قطعه‌بندی اسناد", "پاسخ مستند و ارجاع به منبع", "پروژه‌ی راهنمادار: ربات پرسش و پاسخ روی مستندات"]
  - t: "ساخت ایجنت‌های هوش مصنوعی"
    l: ["اجزای یک ایجنت", "حلقه‌ی ایجنت", "افزودن حافظه و ابزار به ایجنت", "برنامه‌ریزی و کارهای چندمرحله‌ای", "پروژه‌ی راهنمادار: دستیار پژوهشی"]
  - t: "LangChain و LangGraph"
    l: ["چرا از چارچوب استفاده کنیم", "مبانی LangChain", "RAG با LangChain", "ایجنت با LangGraph", "پروژه‌ی راهنمادار: ایجنت مبتنی بر LangGraph"]
  - t: "استقرار اپلیکیشن‌های هوش مصنوعی"
    l: ["از نمونه‌ی اولیه تا محیط عملیاتی", "پاسخ جریانی و مدیریت خطا", "مدیریت هزینه و توکن", "امنیت و ارائه‌ی سرویس", "پروژه‌ی راهنمادار: استقرار یک اپلیکیشن هوش مصنوعی"]
