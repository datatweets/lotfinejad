name: Daily analytics report

on:
  schedule:
    - cron: "45 3 * * *"
    - cron: "17 5 * * *"
    - cron: "37 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-analytics-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check the actual sent receipt
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report_day=$(date -u +%Y-%m-%d)
          receipt_name="daily-report-sent-${report_day}"
          echo "receipt_name=${receipt_name}" >> "$GITHUB_OUTPUT"
          receipt=$(gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" --jq ".artifacts[] | select(.name == \"${receipt_name}\" and .expired == false) | .id")
          if [ -n "$receipt" ]; then
            echo "A sent receipt already exists for today; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7.0.1
        if: steps.guard.outputs.skip != 'true'
      - uses: actions/setup-node@v7.0.0
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install mail client from the lockfile
        if: steps.guard.outputs.skip != 'true'
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Build and send report
        id: send
        if: steps.guard.outputs.skip != 'true'
        env:
          UMAMI_SHARE_ID: ${{ secrets.UMAMI_SHARE_ID || vars.UMAMI_SHARE_ID }}
          UMAMI_API_KEY: ${{ secrets.UMAMI_API_KEY || vars.UMAMI_API_KEY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME || vars.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD || vars.SMTP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO || vars.REPORT_TO }}
          UMAMI_WEBSITE_ID: 79b750c9-0c59-4886-9f0f-ba74462f7798
          SITE_DOMAIN: lotfinejad.ir
          REPORT_RECEIPT_PATH: ${{ runner.temp }}/daily-report-sent.json
        run: node scripts/daily-report.mjs
      - name: Preserve the actual sent receipt
        if: steps.send.outputs.status == 'sent'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.guard.outputs.receipt_name }}
          path: ${{ runner.temp }}/daily-report-sent.json
          retention-days: 7
          if-no-files-found: error
