slug: power-bi-pl300
en: "Power BI Data Analyst (PL-300)"
fa: "تحلیل داده با Power BI و آمادگی PL-300"
level: "مقدماتی تا پیشرفته"
hours: 32
summary: "تبدیل داده‌های خام به گزارش‌های مدیریتی با Power BI؛ از آماده‌سازی داده در Power Query و مدل‌سازی تا DAX، طراحی داشبورد و انتشار امن گزارش."
project: "ساخت یک راهکار کامل Power BI برای تحلیل فروش، عملیات یا عملکرد سازمان"
outcomes:
  - "اتصال به منابع داده و پاک‌سازی و تبدیل داده با Power Query"
  - "ساخت مدل تحلیلی با روابط درست و طرح ستاره‌ای"
  - "نوشتن Measureها و محاسبات تحلیلی با DAX"
  - "طراحی گزارش‌های تعاملی و قابل‌فهم برای مخاطب مدیریتی"
  - "انتشار و نگهداری گزارش با کنترل دسترسی و به‌روزرسانی داده"
prereqs:
  - "آشنایی مقدماتی با جدول‌ها و تحلیل داده مفید است"
  - "تجربه‌ی قبلی با Power BI یا DAX لازم نیست"
tools: ["Power BI Desktop", "Power Query", "DAX", "Power BI Service"]
modules:
  - t: "مبانی Power BI و اتصال به داده"
    l: ["اجزای Power BI و چرخه‌ی کار تحلیلگر", "اتصال به فایل و پایگاه داده", "انتخاب منبع داده‌ی مناسب", "بارگذاری داده و مدیریت تنظیمات"]
  - t: "آماده‌سازی داده با Power Query"
    l: ["شناخت نوع داده و کیفیت داده", "پاک‌سازی مقادیر گمشده و تکراری", "ادغام و الحاق جدول‌ها", "تبدیل داده با زبان M در حد نیاز", "پروژه‌ی راهنمادار: آماده‌سازی داده‌ی چند منبع"]
  - t: "مدل‌سازی داده"
    l: ["ساخت مدل ستاره‌ای", "تعریف رابطه‌ها و جهت فیلتر", "جدول واقعیت و بُعد", "مدیریت تاریخ و جدول تقویم", "بررسی خطاهای رایج مدل‌سازی"]
  - t: "محاسبات تحلیلی با DAX"
    l: ["ستون محاسباتی در برابر Measure", "توابع پایه و زمینه‌ی فیلتر", "CALCULATE و تغییر زمینه", "تحلیل زمان با DAX", "Measureهای پویا و شاخص‌های عملکرد", "پروژه‌ی راهنمادار: محاسبه‌ی فروش و رشد دوره‌ای"]
  - t: "طراحی گزارش و روایت داده"
    l: ["انتخاب نمودار بر اساس پرسش کسب‌وکار", "چیدمان و سلسله‌مراتب بصری", "فیلترها، Drill-through و Tooltip", "نشانک‌ها و تعامل بین صفحه‌ها", "بازبینی خوانایی و دسترس‌پذیری گزارش"]
  - t: "انتشار، امنیت و آمادگی آزمون"
    l: ["انتشار گزارش در Power BI Service", "تنظیم Refresh و Gateway", "امنیت سطح سطر (RLS)", "بهینه‌سازی عملکرد مدل و گزارش", "مرور حوزه‌های آزمون PL-300", "پروژه‌ی پایانی: داشبورد مدیریتی قابل انتشار"]
