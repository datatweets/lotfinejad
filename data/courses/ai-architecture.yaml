slug: ai-architecture
en: "Enterprise AI Architecture"
fa: "معماری سازمانی هوش مصنوعی"
level: "متوسط تا پیشرفته"
hours: 40
summary: "طراحی راهکار هوش مصنوعی سازمانی از تعریف مسئله تا بهره‌برداری؛ با تمرکز بر معماری داده و مدل، RAG، امنیت، حاکمیت، عملیات و سنجش ارزش کسب‌وکار."
project: "طراحی معماری و نقشه‌ی اجرای یک راهکار هوش مصنوعی سازمانی بر پایه‌ی یک مسئله‌ی واقعی"
outcomes:
  - "تشخیص اینکه کدام مسئله‌ی سازمانی برای راهکار AI مناسب است و چگونه ارزش آن سنجیده می‌شود"
  - "طراحی معماری داده و سرویس برای راهکارهای پیش‌بینی‌محور یا مبتنی بر مدل زبانی"
  - "ارزیابی انتخاب میان مدل ابری، متن‌باز، RAG و روش‌های کلاسیک یادگیری ماشین"
  - "در نظر گرفتن امنیت، محرمانگی، حاکمیت و بازبینی انسانی از ابتدا"
  - "طراحی برنامه‌ی استقرار، ارزیابی و پایش راهکار در محیط عملیاتی"
prereqs:
  - "آشنایی با مفاهیم داده، نرم‌افزار و چرخه‌ی توسعه‌ی سامانه مفید است"
  - "برای بخش‌های آزمایشگاهی، تجربه‌ی مقدماتی Python و APIها کمک‌کننده است"
tools: ["Python", "Cloud AI services", "Vector databases", "Docker", "CI/CD and observability tools"]
modules:
  - t: "تعریف مسئله و ارزش کسب‌وکار"
    l: ["تفکیک مسئله‌ی کسب‌وکار از راه‌حل فناورانه", "ارزیابی تناسب AI و گزینه‌های ساده‌تر", "تعیین معیار موفقیت و خط مبنا", "برآورد هزینه، ریسک و بازگشت سرمایه", "کارگاه: اولویت‌بندی موارد کاربرد"]
  - t: "معماری داده و مدل"
    l: ["جریان داده و مرزهای اعتماد", "کیفیت، دسترسی و حاکمیت داده", "جایگاه مدل‌های کلاسیک و مدل‌های زبانی", "معماری سرویس و اتصال به سامانه‌های موجود", "الگوی نمونه تا محیط عملیاتی"]
  - t: "معماری راهکارهای مدل زبانی و RAG"
    l: ["انتخاب مدل و ارزیابی محدودیت‌ها", "جریان بازیابی و تولید پاسخ", "قطعه‌بندی، Embedding و جست‌وجوی معنایی", "ارجاع به منبع و مدیریت پاسخ نامطمئن", "ابزارها، گردش‌کار و Human-in-the-loop"]
  - t: "امنیت و حاکمیت هوش مصنوعی"
    l: ["مدل تهدید برای اپلیکیشن‌های AI", "حفاظت از داده و مدیریت دسترسی", "Prompt Injection و ریسک خروجی مدل", "ثبت تصمیم‌ها و ردگیری تغییرات", "حاکمیت، بازبینی و مسئولیت‌پذیری"]
  - t: "ارزیابی و عملیات"
    l: ["طراحی مجموعه‌ی ارزیابی متناسب با کاربرد", "سنجش کیفیت، هزینه و تأخیر", "آزمون پسرفت مدل و پرامپت", "پایش رانش داده و افت عملکرد", "مدیریت رخداد و مسیر بازگشت"]
  - t: "نقشه‌ی راه و پروژه‌ی معماری"
    l: ["طراحی معماری هدف و تصمیم‌های کلیدی", "تقسیم اجرا به گام‌های قابل سنجش", "برنامه‌ی ظرفیت تیم و هزینه‌ی عملیاتی", "ارائه و بازبینی معماری توسط گروه", "پروژه‌ی پایانی: نقشه‌ی اجرای راهکار AI سازمانی"]
