<header class="nav">
  <div class="nav-inner">
    <nav class="nav-links" aria-label="ناوبری اصلی">
      {{ range site.Menus.main }}
        <a class="nav-link{{ if $.IsMenuCurrent "main" . }} is-active{{ end }}" href="{{ .URL | relLangURL }}">
          {{ partial "icon.html" .Params.icon }}
          <span>{{ .Name }}</span>
        </a>
      {{ end }}
    </nav>
    <div class="nav-end">
      <button class="icon-btn" id="themeBtn" type="button" aria-label="تغییر پوسته"></button>
      <button class="icon-btn nav-toggle" id="menuBtn" type="button" aria-label="منو" aria-expanded="false"></button>
    </div>
  </div>
  <nav class="drawer" id="drawer" aria-label="ناوبری موبایل">
    {{ range site.Menus.main }}
      <a href="{{ .URL | relLangURL }}">{{ partial "icon.html" .Params.icon }}{{ .Name }}</a>
    {{ end }}
  </nav>
</header>
