slug: polars-for-python-developers
en: "Polars for Python Developers"
fa: "پردازش سریع داده با Polars"
level: "مقدماتی تا متوسط"
summary: "ساخت جریان‌های پردازش داده‌ی سریع و قابل‌اعتماد با Polars: عبارت‌ها، Schema، Join، توابع پنجره‌ای، اجرای Lazy و یک پروژه‌ی پایانی واقعی."
project: "جریان کامل تحلیل داده‌ی فروشگاه Thistlewood Goods"
outcomes:
  - "تفکر بر پایه‌ی عبارت‌ها (Expression) با pl.col، select، with_columns و filter به‌عنوان الگوی اصلی کار"
  - "پاک‌سازی، اعتبارسنجی و تبدیل نوع داده‌های واقعی و نامرتب"
  - "تجمیع با group_by، توابع پنجره‌ای، Join و تغییر شکل داده"
  - "کار با داده‌های تودرتو، سری‌های زمانی و اجرای Lazy روی فایل‌های CSV، JSON، Parquet و SQLite"
prereqs:
  - "آشنایی مقدماتی با پایتون: متغیر، تابع، لیست و دیکشنری"
  - "آشنایی با خط فرمان و یک ویرایشگر کد"
  - "نیازی به تجربه‌ی pandas، حساب ابری یا GPU نیست"
tools: ["Polars", "Python", "Parquet", "SQLite"]
modules:
  - t: "شروع با یک جریان کاری واقعی"
    l: ["چرا Polars برای توسعه‌دهندگان پایتون اهمیت دارد", "تفاوت Polars با پایتون خام و pandas", "راه‌اندازی یک پروژه‌ی محلی Polars", "نصب Polars و اجرای اولین جریان پردازش", "پروژه‌ی راهنمادار: خواندن و خلاصه‌کردن یک فایل CSV"]
  - t: "DataFrame، Series و Schema"
    l: ["Series چیست؟", "DataFrame چیست؟", "ساخت داده از لیست‌ها و رکوردها", "Schema، انواع داده و مدیریت مقادیر Null", "مدل بدون اندیس", "پروژه‌ی راهنمادار: ابزار بررسی داده"]
  - t: "یادگیری زودهنگام سیستم عبارت‌ها"
    l: ["عبارت (Expression) چیست؟", "انتخاب ستون با pl.col", "ساخت مقادیر ثابت و ستون‌های مشتق", "تبدیل داده با select و with_columns", "فیلتر با عبارت‌ها", "پروژه‌ی راهنمادار: اسکریپت ساخت ویژگی"]
  - t: "پاک‌سازی و اعتبارسنجی داده"
    l: ["پاک‌سازی داده‌های نامرتب CSV", "تبدیل و اعتبارسنجی نوع داده", "مدیریت ایمن داده‌های گمشده", "مقادیر نامعتبر و دسته‌بندی‌های ناهماهنگ", "تهیه‌ی گزارش کیفیت داده", "پروژه‌ی راهنمادار: پاک‌ساز داده‌های فروش"]
  - t: "رشته‌ها، دسته‌ها و پردازش متن"
    l: ["پاک‌سازی رشته‌ها با فضای نام String", "استخراج و جایگزینی مقادیر با عبارات منظم", "یکسان‌سازی متن و دسته‌بندی‌ها", "کار با داده‌های دسته‌ای و شمارشی", "پروژه‌ی راهنمادار: یکسان‌سازی کاتالوگ محصولات"]
  - t: "کار با داده‌های تودرتو"
    l: ["تفاوت List و Array", "ساخت و بررسی ستون‌های لیستی", "اعمال تبدیل روی عناصر لیست", "ستون‌های Struct برای مقادیر گروهی", "پروژه‌ی راهنمادار: تبدیل سفارش‌های تودرتو به جدول‌های آماده‌ی تحلیل"]
  - t: "تجمیع داده و توابع پنجره‌ای"
    l: ["گروه‌بندی و خلاصه‌سازی با group_by", "چند تجمیع در یک کوئری", "تجمیع شرطی", "عبارت‌های پنجره‌ای با over", "رتبه‌بندی، جمع تجمعی و مقایسه‌ی غلتان", "پروژه‌ی راهنمادار: گزارش عملکرد مشتریان"]
  - t: "Join، تغییر شکل و ترکیب داده‌ها"
    l: ["الحاق عمودی و افقی", "Join از نوع Inner، Left، Right و Full", "Join از نوع Semi، Anti و Cross", "Join غیرتساوی و As-Of", "Pivot و Unpivot داده", "پروژه‌ی راهنمادار: داده‌ی یکپارچه‌ی خرده‌فروشی"]
  - t: "سری‌های زمانی و کار با تاریخ"
    l: ["انواع Date، Datetime و Duration", "تجزیه و قالب‌بندی برچسب‌های زمانی", "گروه‌بندی روزانه، هفتگی و ماهانه", "پنجره‌های زمانی غلتان و پویا", "کار دقیق با منطقه‌های زمانی", "پروژه‌ی راهنمادار: گزارش پایش تراکنش‌ها"]
  - t: "اجرای Lazy، فایل‌ها و مهندسی داده‌ی محلی"
    l: ["اجرای Eager در برابر Lazy", "تفاوت read_*‎، scan_*‎ و ‎.lazy()‎", "فایل‌های CSV، JSON، Parquet و SQLite", "ساخت دریاچه‌ی داده‌ی محلی با پارتیشن‌بندی", "طرح اجرای کوئری و عادت‌های بهینه‌سازی", "پروژه‌ی راهنمادار: یک جریان تحلیلی محلی"]
  - t: "آزمون، اشکال‌زدایی و کارایی"
    l: ["نوشتن آزمون برای تبدیل‌های Polars", "اشکال‌زدایی رفتار کوئری و خطاهای رایج", "اندازه‌گیری و مقایسه‌ی کارایی", "بررسی عمیق طرح اجرای کوئری", "اجرای جریانی و پردازش داده‌های بزرگ‌تر از حافظه", "پروژه‌ی راهنمادار: جریان پردازش آزموده و محک‌خورده"]
  - t: "پروژه‌ی پایانی"
    l: ["پروژه‌ی پایانی: جریان تحلیل داده‌ی Thistlewood"]
