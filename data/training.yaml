formats:
  - icon: "people"
    title: "حضوری در محل سازمان"
    desc: "برگزاری کلاس در سازمان شما، با تمرین روی ابزارها و نمونه‌هایی نزدیک به کار روزانه‌ی تیم. زمان و مکان با هماهنگی تعیین می‌شود."
  - icon: "cpu"
    title: "آنلاین و زنده"
    desc: "کلاس‌های تعاملی آنلاین با پرسش و پاسخ، تمرین گروهی و بازخورد مستقیم؛ مناسب تیم‌هایی که در چند شهر یا دورکار هستند."
  - icon: "grid"
    title: "کارگاه کوتاه یا دوره‌ی جامع"
    desc: "از کارگاه یک‌روزه برای یک موضوع مشخص تا دوره‌ی چندماهه برای آماده‌کردن تیم در یک مسیر شغلی کامل."

paths:
  title: "دوره‌های جامع مسیر شغلی"
  intro: "برای سازمان‌هایی که می‌خواهند تیمی را از پایه برای یک نقش تخصصی آماده کنند. مدت هر مسیر بر اساس سطح شرکت‌کنندگان و برنامه‌ی سازمان تعیین می‌شود."
  items:
    - title: "تحلیلگر داده"
      en: "Data Analyst"
      level: "مقدماتی تا متوسط"
      desc: "پایتون، کار با داده در Pandas، پاک‌سازی داده، تحلیل اکتشافی و ساخت نمودارهای گویا برای مدیران."
    - title: "دانشمند داده"
      en: "Data Scientist"
      level: "مقدماتی تا متوسط"
      desc: "پایتون، آمار و احتمال، آزمون A/B و یادگیری ماشین؛ از پرسش کسب‌وکار تا مدل قابل‌اعتماد."
    - title: "مهندس یادگیری ماشین"
      en: "Machine Learning Engineer"
      level: "مقدماتی تا پیشرفته"
      desc: "از الگوریتم‌های کلاسیک یادگیری ماشین تا یادگیری عمیق، بینایی ماشین و پردازش زبان طبیعی."
    - title: "مهندس داده"
      en: "Data Engineer"
      level: "مقدماتی تا متوسط"
      desc: "پردازش داده‌های حجیم، Spark، Docker و Kubernetes، زمان‌بندی جریان‌های داده با Airflow، Kafka و dbt."
    - title: "مهندس هوش مصنوعی"
      en: "AI Engineer"
      level: "متوسط تا پیشرفته"
      desc: "کار با مدل‌های زبانی بزرگ، طراحی پرامپت، جست‌وجوی معنایی، RAG، ساخت ایجنت و استقرار سامانه."

