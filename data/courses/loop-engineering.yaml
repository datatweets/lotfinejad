slug: loop-engineering
en: "Loop Engineering: Getting AI to Finish the Job"
fa: "هدایت هوش مصنوعی تا انجام کامل کار"
level: "مقدماتی؛ بدون نیاز به برنامه‌نویسی"
summary: "آموزش به‌کارگیری هوش مصنوعی در چرخه‌ای برای اجرا، بازبینی و اصلاح کار تا رسیدن به نتیجه یا توقف به‌موقع؛ مناسب مدیران و کارشناسان غیرفنی و بدون نیاز به برنامه‌نویسی."
project: "یک چرخه‌ی کامل و مستند برای یک کار واقعی"
outcomes:
  - "تعریف هدف‌های روشن و پایان‌پذیر برای کار با هوش مصنوعی"
  - "تعیین معیار بررسی که نشان دهد چرخه درست پیش می‌رود یا نه"
  - "طراحی چرخه‌هایی که به پایان می‌رسند و بی‌پایان ادامه پیدا نمی‌کنند"
  - "شناخت الگوهای کارآمد و الگوهایی که فقط وقت هدر می‌دهند"
  - "اجرای چرخه‌ها در ChatGPT و Claude و سپردن کارهای طولانی‌تر به Claude Code یا Codex"
prereqs:
  - "نیازی به برنامه‌نویسی نیست؛ دوره برای افراد غیرفنی طراحی شده است"
  - "دسترسی به ChatGPT یا Claude"
tools: ["ChatGPT یا Claude", "Claude Code یا Codex (اختیاری، در بخش‌های پایانی)"]
modules:
  - t: "چرا یک پرسش کافی نیست"
    l: ["از پاسخ تا نتیجه", "اجزای یک چرخه", "شما خودتان همان چرخه هستید", "چرخه چه زمانی کمک می‌کند", "آشنایی با چهار ابزار"]
  - t: "نوشتن هدفی که چرخه بتواند به پایان برساند"
    l: ["چرا «بهترش کن» هیچ‌وقت تمام نمی‌شود", "نوشتن تعریف «انجام‌شده»", "دامنه، محدودیت‌ها و آنچه هدف نیست", "شرح کار: قالب قابل استفاده‌ی دوباره برای هدف", "کارگاه هدف‌نویسی: بازنویسی درخواست‌های واقعی"]
  - t: "معیار بررسی: چرخه از کجا می‌فهمد درست پیش می‌رود"
    l: ["معیار بررسی از خود پرسش مهم‌تر است", "انواع بررسی", "پرسش‌های خودارزیابی: نمره‌دهی صادقانه", "روش «دو کلاه»", "وقتی بررسی دروغ می‌گوید: شناسایی «انجام شد» نادرست"]
  - t: "اجرای چرخه در ChatGPT و Claude"
    l: ["چرخه‌های دستی که از مسیر خارج نمی‌شوند", "تنظیمات ماندگار: پروژه‌ها و دستورالعمل‌ها", "چرخه روی اسناد", "چرخه همراه با ابزار: جست‌وجوی وب و Artifactها", "الگوهای چندمرحله‌ای و گزارش رقبا"]
  - t: "سپردن چرخه به ابزار: Claude Code و Codex برای همه"
    l: ["یک ابزار خط فرمان ایجنتیک دقیقاً چه می‌کند", "راه‌اندازی و ایمنی: سطح دسترسی‌ها", "اولین چرخه‌ی خودکار", "قابلیت خودبررسی برای ایجنت", "حافظه‌ی پروژه: CLAUDE.md و AGENTS.md"]
  - t: "طراحی چرخه‌هایی که متوقف می‌شوند"
    l: ["چرخه از کجا می‌فهمد باید متوقف شود", "تعیین محدودیت: بودجه‌ی چرخه", "وقتی چرخه گیر می‌کند", "آموزش پرسیدن به چرخه", "ثبت گزارش چرخه"]
  - t: "الگوهای درست و نادرست چرخه"
    l: ["پیش‌نویس، نقد، بازنویسی", "اول برنامه، بعد اجرا", "تولید و آزمون", "چرخه‌های موازی و تحویل کار", "الگوهای نادرست: چرخه‌ها چگونه به بیراهه می‌روند"]
  - t: "چرخه در کار واقعی و پروژه‌ی پایانی"
    l: ["اعتماد و راستی‌آزمایی", "هزینه، حریم خصوصی و اطلاعاتی که نباید وارد شود", "دستورالعمل‌های آماده‌ی چرخه", "چرخه‌های زمان‌بندی‌شده و تکرارشونده", "سپردن چرخه‌ها به تیم و پروژه‌ی پایانی"]
