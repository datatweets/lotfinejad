slug: mlops-azure
en: "MLOps with Azure"
fa: "MLOps در Azure"
level: "متوسط تا پیشرفته"
hours: 32
summary: "آموزش مدیریت چرخه‌ی عمر مدل‌های یادگیری ماشین در Azure؛ از ثبت آزمایش و نسخه‌بندی داده و مدل تا استقرار، پایش عملکرد و تشخیص رانش."
project: "ساخت یک جریان MLOps برای آموزش، استقرار و پایش مدل پیش‌بینی در Azure"
outcomes:
  - "طراحی جریان تکرارپذیر آموزش و ارزیابی مدل در Azure Machine Learning"
  - "ثبت آزمایش‌ها و مدیریت نسخه‌ی داده، کد و مدل"
  - "استقرار مدل به‌صورت سرویس و مدیریت نسخه‌های محیط عملیاتی"
  - "اتصال آزمون و استقرار مدل به جریان CI/CD"
  - "پایش کیفیت، تأخیر و رانش داده و تعریف اقدام اصلاحی"
prereqs:
  - "تسلط مقدماتی بر Python و مفاهیم پایه‌ی یادگیری ماشین"
  - "آشنایی با Git و خط فرمان مفید است"
  - "برای تمرین عملی به اشتراک یا محیط آزمایشی Azure نیاز است؛ هزینه‌ی احتمالی منابع ابری جداگانه است"
tools: ["Azure Machine Learning", "Azure ML CLI/SDK", "Git", "Azure DevOps or GitHub Actions", "Docker"]
modules:
  - t: "مبانی MLOps و محیط Azure"
    l: ["چرخه‌ی عمر مدل در محیط عملیاتی", "تفاوت نمونه‌ی اولیه و سامانه‌ی تولیدی", "معماری مفهومی Azure Machine Learning", "ساخت Workspace و اتصال منابع", "پروژه‌ی راهنمادار: آماده‌سازی محیط کار"]
  - t: "آزمایش و آماده‌سازی داده"
    l: ["ساخت محیط تکرارپذیر اجرا", "ثبت آزمایش و معیارها", "نسخه‌بندی داده و کد", "تعریف و بازاستفاده از دارایی داده", "پروژه‌ی راهنمادار: ثبت آزمایش‌های مدل"]
  - t: "جریان آموزش و ثبت مدل"
    l: ["تعریف گام‌های آماده‌سازی و آموزش", "ساخت Pipeline آموزش", "اجرای موازی و پارامتردهی", "مقایسه‌ی آزمایش‌ها", "ثبت مدل و مدیریت نسخه"]
  - t: "استقرار مدل"
    l: ["انتخاب الگوی استقرار آنلاین یا دسته‌ای", "ساخت محیط سرویس‌دهی", "استقرار نسخه‌ی مدل", "آزمون Endpoint و مدیریت خطا", "انتقال امن تنظیمات و اسرار"]
  - t: "CI/CD برای یادگیری ماشین"
    l: ["کنترل نسخه‌ی کد و تعریف شاخه‌ها", "آزمون داده و کد در خط CI", "اجرای خودکار جریان آموزش", "تأیید و انتشار مدل", "بازگشت به نسخه‌ی قبلی"]
  - t: "پایش و حاکمیت مدل"
    l: ["پایش خطا، تأخیر و مصرف منابع", "تشخیص تغییر توزیع و رانش داده", "پایش معیارهای کیفیت مدل", "هشدار و بازآموزی بر مبنای آستانه", "مستندسازی و ردگیری نسخه‌ها", "پروژه‌ی پایانی: استقرار و پایش یک مدل کامل"]
