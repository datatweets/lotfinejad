baseURL = "https://lotfinejad.ir/"
languageCode = "fa-ir"
defaultContentLanguage = "fa"
title = "لطفی‌نژاد"
enableRobotsTXT = true
summaryLength = 40

[pagination]
  pagerSize = 8

[params]
  description = "وب‌سایت شخصی و بلاگ لطفی‌نژاد"
  author = "لطفی‌نژاد"
  direction = "rtl"
  # Set to false to hide the "GitHub" link in the footer.
  githubUser = "datatweets"

  # Hero / profile section (home page)
  avatarInitial = "ل"
  # TODO: replace with your real title — kept as a visible placeholder on purpose.
  headlinePlaceholder = "[عنوان شغلی شما]"
  heroTagline = "می‌نویسم درباره‌ی هوش مصنوعی، مهندسی داده و رهبری فنی"
  bio = "در این‌جا چیزهایی را می‌نویسم که در مسیر کار روی سامانه‌های داده و هوش مصنوعی، و همکاری با تیم‌های فنی یاد گرفته‌ام؛ از تصمیم‌های مهندسی گرفته تا مهارت‌هایی که بازار کار امروز واقعاً از یک مهندس هوش مصنوعی می‌خواهد."
  focusTags = ["هوش مصنوعی", "مهندسی داده", "رهبری فنی"]
  linkedinUser = ""  # TODO: add your LinkedIn username to show the link

[taxonomies]
  tag = "tags"
  category = "categories"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[markup]
  [markup.highlight]
    style = "github"
    lineNos = false
    codeFences = true
    guessSyntax = true
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true

[[menu.main]]
  name = "خانه"
  url = "/"
  weight = 10

[[menu.main]]
  name = "درباره من"
  url = "/about/"
  weight = 20

[[menu.main]]
  name = "نمونه‌کارها"
  url = "/projects/"
  weight = 30

[[menu.main]]
  name = "رزومه"
  url = "/resume/"
  weight = 40

[[menu.main]]
  name = "مقالات"
  url = "/posts/"
  weight = 50
