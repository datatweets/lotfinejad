slug: sql
en: "SQL & Databases"
fa: "SQL و پایگاه داده"
level: "مقدماتی تا پیشرفته"
summary: "آموزش SQL از نخستین پرس‌وجو تا کار با پایگاه‌های داده‌ی عملیاتی؛ شامل Join، توابع پنجره‌ای، PostgreSQL و SQLAlchemy، همراه با تمرین روی داده‌های واقعی."
project: "کار با پایگاه‌های داده‌ی واقعی و پروژه‌های راهنمادار"
outcomes:
  - "نوشتن کوئری‌های SQL برای انتخاب، فیلتر، مرتب‌سازی و تجمیع داده در یک پایگاه داده‌ی واقعی"
  - "ترکیب جدول‌ها با Join و پاسخ به پرسش‌های پیچیده‌تر با زیرکوئری، CTE و View"
  - "رتبه‌بندی، مقایسه و محاسبه روی سطرها با توابع پنجره‌ای، بدون خروج از SQL"
  - "طراحی، بارگذاری و مدیریت PostgreSQL و بهینه‌سازی کوئری‌های کند با ایندکس"
  - "اجرای کوئری روی پایگاه داده از درون پایتون، به‌صورت مستقیم و با SQLAlchemy"
prereqs:
  - "نیازی به آشنایی قبلی با SQL نیست؛ دوره از اولین کوئری شروع می‌شود"
  - "آشنایی مقدماتی با پایتون برای بخش‌های پایانی مفید است، اما برای دوسوم ابتدایی دوره لازم نیست"
tools: ["PostgreSQL", "psql", "psycopg2", "SQLAlchemy", "pandas"]
modules:
  - t: "شروع کار با SQL"
    l: ["آشنایی با پایگاه داده و Schema", "ستون‌ها، انواع داده و توابع", "فیلتر سطرها بر اساس مقادیر عددی", "فیلتر بر اساس متن و دسته‌بندی", "مرتب‌سازی و محدودکردن نتایج", "منطق شرطی با CASE و سبک نوشتن تمیز", "پروژه‌ی راهنمادار: تحلیل کمپین‌های Kickstarter"]
  - t: "خلاصه‌سازی داده با SQL"
    l: ["توابع تجمیعی: COUNT، SUM، AVG و سایر توابع", "ساخت آماره‌های خلاصه", "گروه‌بندی داده با GROUP BY", "گروه‌بندی بر اساس چند ستون و فیلتر گروه‌ها"]
  - t: "ترکیب جدول‌ها با Join"
    l: ["آشنایی با Join", "Join همراه با فیلتر، گروه‌بندی و مرتب‌سازی", "Self Join، Outer Join و Cross Join", "ترکیب نتایج با عملگرهای مجموعه‌ای"]
  - t: "زیرکوئری، CTE و View"
    l: ["زیرکوئری‌های تک‌مقداری", "زیرکوئری‌های چندسطری و چندستونی", "زیرکوئری‌های تودرتو و وابسته", "عبارات جدولی مشترک (CTE)", "ساخت و استفاده از View", "پروژه‌ی راهنمادار: تحلیل مشتریان و محصولات"]
  - t: "توابع پنجره‌ای"
    l: ["آشنایی با توابع پنجره‌ای", "قاب پنجره: ROWS و RANGE", "توابع تجمیعی پنجره‌ای", "توابع رتبه‌بندی: ROW_NUMBER، RANK و NTILE", "توابع جابه‌جایی: LAG، LEAD و FIRST_VALUE", "توابع توزیع و صدک", "پروژه‌ی راهنمادار: تحلیل فروش شرکت Northwind Traders"]
  - t: "کوئری‌نویسی روی پایگاه داده از پایتون"
    l: ["اجرای کوئری SQL با sqlite3", "از نتیجه‌ی SQL تا DataFrame در pandas"]
  - t: "PostgreSQL برای مهندسان داده"
    l: ["آشنایی با PostgreSQL", "طراحی جدول و انتخاب نوع داده", "Prepared Statement و جلوگیری از حمله‌ی SQL Injection", "بارگذاری و کپی داده", "مدیریت کاربران و پایگاه‌های داده", "پروژه: نصب PostgreSQL روی سیستم محلی", "پروژه‌ی راهنمادار: ساخت پایگاه داده‌ی گزارش‌های جرم"]
  - t: "بهینه‌سازی PostgreSQL"
    l: ["آشنایی با ساختار درونی PostgreSQL", "خواندن طرح اجرای کوئری با EXPLAIN", "افزایش سرعت کوئری‌ها با ایندکس", "راهبردهای پیشرفته‌ی ایندکس‌گذاری", "Vacuum، تراکنش‌ها و اصول ACID"]
  - t: "ابزارهای پایگاه داده در محیط عملیاتی"
    l: ["انبار داده‌ی ابری با Snowflake", "آشنایی با پایگاه‌های داده‌ی NoSQL", "کار عملی با MongoDB"]
  - t: "SQLAlchemy در پایتون"
    l: ["اتصال با Engine و Metadata", "تعریف جدول و درج داده", "کوئری‌نویسی با select()‎ و where()‎", "Join و Self-Join", "به‌روزرسانی، حذف و تراکنش‌ها", "ORM: مدل‌های اعلانی و Session", "صفحه‌بندی، عملیات انبوه و کارایی", "پروژه‌ی راهنمادار: تحلیل داده‌های سرشماری آمریکا"]
