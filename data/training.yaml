eyebrow: "آموزش سازمانی"
title: "دوره‌های جامع داده و هوش مصنوعی، به‌صورت حضوری و آنلاین"
lead: >-
  دوره‌های تخصصی برای تیم‌ها و سازمان‌ها، از مبانی تحلیل داده تا توسعه‌ی سامانه‌های هوش مصنوعی.
  سرفصل، سطح و تمرین‌ها بر اساس نیاز سازمان طراحی می‌شوند و آموزش به زبان فارسی ارائه می‌شود.

