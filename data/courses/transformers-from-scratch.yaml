slug: transformers-from-scratch
en: "Transformers from Scratch"
fa: "ترنسفورمرها از پایه"
level: "پیشرفته"
summary: "آموزش ساخت ترنسفورمر با NumPy؛ از توجه نقطه‌ای و چندسر و رمزگذاری موقعیت تا بلوک ترنسفورمر و یک GPT کوچک، با پیاده‌سازی دستی ضرب‌های ماتریسی و گرادیان‌ها."
project: "یک مدل GPT کوچک و کارا، ساخته‌شده از پایه با NumPy"
outcomes:
  - "پیاده‌سازی توجه نقطه‌ای مقیاس‌شده و توجه چندسر در NumPy"
  - "افزودن رمزگذاری موقعیت و بردارهای توکن و ساخت یک بلوک کامل ترنسفورمر"
  - "به‌کارگیری ماسک علّی برای تبدیل معماری به یک GPT"
  - "آموزش یک GPT کوچک در سطح کاراکتر با پس‌انتشار دست‌نویس"
  - "تولید متن و کنترل آن با راهبردهای نمونه‌گیری"
prereqs:
  - "تسلط بر NumPy و ابعاد آرایه‌ها؛ از هیچ چارچوب یادگیری عمیقی استفاده نمی‌شود"
  - "درک مبانی شبکه‌های عصبی: گذر رو به جلو، پس‌انتشار، گرادیان کاهشی و آنتروپی متقاطع Softmax"
tools: ["NumPy (بدون PyTorch، TensorFlow یا Hugging Face)"]
modules:
  - t: "از دنباله‌ها تا سازوکار توجه"
    l: ["محدودیت‌های شبکه‌های بازگشتی", "ایده‌ی توجه: جست‌وجوی وزن‌دار", "شباهت، امتیاز و وزن‌های Softmax", "از جست‌وجو تا توجه یادگرفته‌شده", "پروژه‌ی راهنمادار: یک لایه‌ی توجه از نوع بازیابی"]
  - t: "خودتوجهی از پایه"
    l: ["Q، K و V: سه تصویرسازی", "توجه نقطه‌ای مقیاس‌شده", "ماتریس توجه: چه کسی به چه کسی توجه می‌کند", "پس‌انتشار در لایه‌ی توجه", "پروژه‌ی راهنمادار: کلاس لایه‌ی خودتوجهی"]
  - t: "توجه چندسر"
    l: ["چرا یک سر کافی نیست", "تقسیم به چند سر", "توجه موازی و الحاق نتایج", "پس‌انتشار در توجه چندسر", "پروژه‌ی راهنمادار: لایه‌ی توجه چندسر"]
  - t: "رمزگذاری موقعیت و بردارهای توکن"
    l: ["چرا توجه به اطلاعات موقعیت نیاز دارد", "بردارهای توکن (Token Embedding)", "رمزگذاری موقعیت سینوسی", "بردارهای موقعیت یادگرفته‌شده", "پروژه‌ی راهنمادار: لایه‌ی Embedding همراه با موقعیت"]
  - t: "بلوک ترنسفورمر"
    l: ["اتصال‌های باقیمانده", "نرمال‌سازی لایه", "شبکه‌ی پیش‌خور", "سرهم‌کردن بلوک", "پروژه‌ی راهنمادار: کلاس بلوک ترنسفورمر"]
  - t: "ماسک علّی و GPT"
    l: ["ایده‌ی خودرگرسیو", "ماسک علّی", "پشته‌ی فقط‌رمزگشا", "سر مدل زبانی و تابع زیان", "پروژه‌ی راهنمادار: سرهم‌کردن یک GPT کامل"]
  - t: "آموزش یک GPT کوچک"
    l: ["دسته‌بندی و بارگذاری داده", "بهینه‌ساز Adam", "حلقه‌ی آموزش", "پایش آموزش و بیش‌برازش", "پروژه‌ی راهنمادار: آموزش GPT کوچک"]
  - t: "تولید متن و نمونه‌گیری"
    l: ["رمزگشایی حریصانه و محدودیت‌های آن", "نمونه‌گیری با دما", "نمونه‌گیری Top-k", "نمونه‌گیری Top-p (هسته‌ای)", "پروژه‌ی راهنمادار: یک تولیدکننده‌ی متن"]
  - t: "پروژه‌ی پایانی"
    l: ["پروژه‌ی راهنمادار: ساخت و آموزش GPT کوچک خودتان"]
