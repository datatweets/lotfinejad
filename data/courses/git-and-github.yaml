slug: git-and-github
en: "Version Control with Git & GitHub"
fa: "کنترل نسخه با Git و GitHub"
level: "مقدماتی تا متوسط"
summary: "یادگیری Git و GitHub از پایه: ثبت تغییرات، ایجاد و ادغام شاخه‌ها، همکاری با Pull Request و تسلط بر روندهای کاری که تیم‌های واقعی هر روز به کار می‌گیرند."
project: "کار با مخزن‌ها، شاخه‌ها و Pull Requestهای واقعی"
outcomes:
  - "ثبت کار با Commitهایی که بعدها به‌راحتی قابل فهم باشند"
  - "ایجاد و ادغام شاخه‌ها با اطمینان، از جمله رفع تعارض‌ها"
  - "کار با مخزن‌های راه دور، Pull Request و بازبینی کد در GitHub"
  - "بازنویسی و بازیابی تاریخچه بدون ازدست‌دادن کار"
  - "خودکارسازی بررسی‌ها با GitHub Actions"
prereqs:
  - "نیازی به تجربه‌ی قبلی کنترل نسخه نیست"
  - "خط فرمان و یک حساب رایگان GitHub"
tools: ["Git", "GitHub", "GitHub Actions", "pytest"]
modules:
  - t: "مبانی کنترل نسخه"
    l: ["کنترل نسخه چیست", "نصب و پیکربندی Git", "اولین مخزن", "ثبت تغییرات", "پروژه‌ی راهنمادار: کنترل نسخه برای پروژه‌ی SkyLog"]
  - t: "کار با تاریخچه"
    l: ["خواندن تاریخچه", "بررسی تغییرات", "نادیده‌گرفتن فایل‌ها", "بازگرداندن تغییرات", "پروژه‌ی راهنمادار: مرتب‌کردن یک مخزن آشفته"]
  - t: "شاخه‌سازی و ادغام"
    l: ["مفهوم شاخه", "ادغام", "تعارض در ادغام", "کنارگذاشتن موقت کار ناتمام (Stash)", "پروژه‌ی راهنمادار: دو قابلیت، یک تعارض"]
  - t: "GitHub و مخزن‌های راه دور"
    l: ["GitHub چیست و ساخت مخزن", "اتصال مخزن محلی به مخزن راه دور", "همگام‌سازی با Fetch، Pull و Push", "ساختار یک مخزن", "پروژه‌ی راهنمادار: انتشار SkyLog در GitHub"]
  - t: "همکاری با Pull Request"
    l: ["مدل Fork و Pull Request", "ایجاد Pull Request", "بازبینی کد", "همگام نگه‌داشتن Fork", "پروژه‌ی راهنمادار: افزودن یک قابلیت از طریق Pull Request"]
  - t: "روندهای کاری تیمی"
    l: ["راهبردهای شاخه‌بندی", "قراردادهای Commit و نوشتن پیام‌های خوب", "همکاری بدون تداخل در کار یکدیگر", "برچسب‌ها و نسخه‌های انتشار", "پروژه‌ی راهنمادار: چرخه‌ی کامل از قابلیت تا انتشار"]
  - t: "بازنویسی و بازیابی تاریخچه"
    l: ["Rebase در برابر Merge", "Rebase تعاملی", "Cherry-Pick", "بازیابی: reflog و bisect", "پروژه‌ی راهنمادار: مرتب‌سازی و بازیابی یک شاخه"]
  - t: "خودکارسازی با GitHub"
    l: ["Issueها و پیگیری پروژه", "GitHub Actions: مبانی یکپارچه‌سازی مداوم", "محافظت از شاخه و بررسی‌های الزامی", "GitHub Pages و خودکارسازی انتشار", "پروژه‌ی راهنمادار: افزودن CI و قالب Issue"]
  - t: "تسلط، ایمنی و پروژه‌ی پایانی"
    l: ["تسلط بر پیکربندی", "امنیت و پاکیزگی مخزن", "راهنمای عیب‌یابی", "پروژه‌ی پایانی بخش ۱: ساخت و انتشار مخزن", "پروژه‌ی پایانی بخش ۲: همکاری تیمی"]
