baseURL = "https://lotfinejad.ir/"
languageCode = "fa-ir"
defaultContentLanguage = "fa"
title = "محمدمهدی لطفی‌نژاد"
enableRobotsTXT = true
summaryLength = 40

[pagination]
  pagerSize = 8

[params]
  description = "محمدمهدی لطفی‌نژاد، مشاور و متخصص داده و هوش مصنوعی: راهبرد، معماری پلتفرم داده، پیاده‌سازی هوش مصنوعی مولد و آموزش تیم‌های فنی سازمان‌ها."
  author = "محمدمهدی لطفی‌نژاد"
  brand = "لطفی‌نژاد"
  brandMark = "ل"
  monoInitial = "م.ل"
  headline = "مشاور و متخصص داده و هوش مصنوعی"
  tagline = "مشاوره، آموزش و پیاده‌سازی راهکارهای داده و هوش مصنوعی برای سازمان‌ها."
  email = "lotfinejad@gmail.com"
  coverTag = "Data & AI"
  direction = "rtl"
  githubUser = "datatweets"
  avatarImage = "/images/avatar.jpg"

  about = [
    "محمدمهدی لطفی‌نژاد مشاور و متخصص داده و هوش مصنوعی با بیش از پانزده سال سابقه در مهندسی داده، یادگیری ماشین و مدل‌های زبانی بزرگ است. سوابق حرفه‌ای او شامل رهبری پروژه‌های داده و هوش مصنوعی برای سازمان‌هایی مانند CIMB، Petronas، Shell، TNB و Axiata و نیز سال‌ها تدریس و پژوهش دانشگاهی است.",
    "فعالیت‌های او در سه حوزه متمرکز است: مشاوره در طراحی و پیاده‌سازی پلتفرم‌های داده و هوش مصنوعی، آموزش تیم‌های مهندسی برای به‌کارگیری عملی مدل‌های زبانی بزرگ و RAG، و ساخت راهکارهای مبتنی بر هوش مصنوعی که مستقیماً در محصول و فرایندهای سازمان به کار گرفته می‌شوند.",
    "با توجه به ناپایداری دسترسی به سرویس‌های ابری هوش مصنوعی خارجی، تمرکز این همکاری‌ها بر مدل‌های متن‌باز و زیرساخت خوداستقرار (self-hosted) است و دوره‌های آموزشی به‌طور کامل به زبان فارسی و متناسب با شرایط واقعی سازمان‌های داخل ایران طراحی می‌شوند."
  ]

  howIWork = [
    "اول سنجه، بعد مدل: پیش از هر تغییر، معیار سنجش بهبود تعریف می‌شود.",
    "ساده‌ترین راهکار کارآمد نخست به بهره‌برداری می‌رسد و پیچیدگی تنها با دلیل مشخص افزوده می‌شود.",
    "تصمیم‌های فنی مکتوب می‌شوند تا اختلاف‌نظرها پیش از پیاده‌سازی آشکار شوند.",
    "هزینه و تأخیر بخشی از کیفیت‌اند، نه ملاحظه‌ای پایانی."
  ]

[taxonomies]
  tag = "tags"
  category = "categories"

