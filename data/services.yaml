eyebrow: "خدمات"
title: "خدمات مشاوره‌ی داده و هوش مصنوعی"
lead: "مشاوره، طراحی و اجرای راهکارهای داده و هوش مصنوعی برای سازمان‌ها؛ از ارزیابی وضعیت و تدوین نقشه‌ی راه تا توسعه، پایش و بازبینی فنی مستقل."

services:
  title: "خدمات مشاوره"
  intro: "خدمات بر پایه‌ی تجربه‌ی اجرایی در پروژه‌های سازمانی طراحی شده‌اند و متناسب با دامنه‌ی نیاز، به‌صورت مستقل یا ترکیبی ارائه می‌شوند."
  groups:
    - title: "راهبرد و برنامه‌ریزی"
      icon: "grid"
      items:
        - title: "ارزیابی آمادگی داده و هوش مصنوعی"
          en: "Data & AI Readiness Assessment"
          desc: "ارزیابی داده، زیرساخت، مهارت تیم و فرایندها برای تعیین نقطه‌ی آغاز و شناسایی موانع به‌کارگیری هوش مصنوعی."
          outputs: ["گزارش ارزیابی امتیازدار در ابعاد داده، فناوری، مهارت و حاکمیت", "فهرست شکاف‌ها و ریسک‌ها", "پیشنهاد گام‌های فوری و کم‌هزینه"]
          evidence: "طراحی و هدایت پروژه‌های داده و هوش مصنوعی برای CIMB، Petronas، Shell و TNB"
        - title: "تدوین نقشه‌ی راه و اولویت‌بندی کاربردها"
          en: "AI Roadmap & Use-Case Prioritization"
          desc: "شناسایی و اولویت‌بندی کاربردهای هوش مصنوعی بر اساس ارزش کسب‌وکار، امکان اجرا و هزینه‌ی موردنیاز."
          outputs: ["فهرست کاربردها با امتیاز ارزش و امکان‌پذیری", "برآورد منابع، هزینه و بازده", "نقشه‌ی راه مرحله‌بندی‌شده و قابل اجرا"]
          evidence: "تهیه‌ی پیشنهادهای فنی و طراحی راهکار برای مشتریان سازمانی در CADS"
        - title: "مشاور ارشد پاره‌وقت داده و هوش مصنوعی"
          en: "Fractional Head of Data & AI"
          desc: "ارائه‌ی رهبری فنی ارشد به‌صورت پاره‌وقت، شامل هدایت تیم داده، تصمیم‌گیری معماری، مشارکت در جذب نیرو و ارتباط با مدیران ارشد."
          outputs: ["جلسات منظم با مدیران و تیم فنی", "بازبینی تصمیم‌ها و مستندات فنی", "کمک در جذب، ارزیابی و منتورینگ متخصصان"]
          evidence: "رهبری تیم‌های داده در CIMB، CADS، Axiata و Magna.ai"
    - title: "زیرساخت و مهندسی داده"
      icon: "db"
      items:
        - title: "طراحی معماری پلتفرم داده"
          en: "Data Platform Architecture"
          desc: "طراحی یا بازبینی زیرساخت داده شامل انبار داده، Lakehouse، جریان‌های انتقال و پردازش، و لایه‌های مدل‌سازی موردنیاز گزارش‌ها و سامانه‌های هوش مصنوعی."
          outputs: ["سند معماری هدف و نقشه‌ی جریان داده", "انتخاب فناوری متناسب با بودجه و محدودیت‌ها", "استانداردهای مدل‌سازی و کیفیت داده"]
          evidence: "معماری زیرساخت داده‌ی تحلیل ریسک روی Microsoft Fabric در بانک CIMB"
          slug: "data-platform-architecture"
          page:
            intro: "گزارش‌های مدیریتی، داشبوردها و سامانه‌های هوش مصنوعی به زیرساخت داده‌ی قابل‌اعتماد نیاز دارند. پراکندگی داده و تفاوت در گزارش‌دهی واحدها، تصمیم‌گیری و توسعه‌ی پروژه‌های جدید را دشوار می‌کند. معماری پلتفرم داده، ساختاری یکپارچه برای گردآوری، پردازش، نگهداری و استفاده از داده تعریف می‌کند که با بودجه و محدودیت‌های سازمان سازگار باشد."
            signs:
              - "گزارش‌های واحدهای مختلف از یک شاخص، عددهای متفاوتی نشان می‌دهند."
              - "تهیه‌ی هر گزارش جدید به کار دستی و استخراج داده از چند سامانه نیاز دارد."
              - "سازمان قصد دارد پروژه‌های هوش مصنوعی را شروع کند، اما داده‌های آن آماده نیست."
              - "زیرساخت فعلی کند، پرهزینه یا وابسته به چند نفر است."
            steps:
              - t: "شناخت وضعیت فعلی"
                d: "بررسی منابع داده، جریان‌های موجود، گزارش‌ها، کاربران و مشکلات فعلی."
              - t: "طراحی معماری هدف"
                d: "تعیین لایه‌های ذخیره‌سازی و پردازش، مدل داده و انتخاب فناوری متناسب با بودجه، مهارت تیم و محدودیت‌های زیرساختی."
              - t: "استانداردها و حاکمیت"
                d: "تعریف استانداردهای نام‌گذاری، مدل‌سازی، کیفیت داده و سطوح دسترسی."
              - t: "برنامه‌ی اجرا"
                d: "تقسیم اجرا به مراحل کوچک با خروجی قابل استفاده در هر مرحله و نظارت فنی بر پیاده‌سازی."
            faq:
              - q: "آیا این طراحی به زیرساخت ابری خارجی وابسته است؟"
                a: "خیر. معماری بر اساس شرایط سازمان طراحی می‌شود و می‌تواند به‌طور کامل روی سرورهای داخلی و با ابزارهای متن‌باز اجرا شود."
              - q: "آیا باید سامانه‌های فعلی کنار گذاشته شوند؟"
                a: "در بیشتر موارد خیر. معماری جدید طوری طراحی می‌شود که سامانه‌های موجود به‌تدریج و بدون وقفه در کار سازمان به آن متصل شوند."
              - q: "خروجی این خدمت چیست؟"
                a: "سند معماری هدف، نقشه‌ی جریان داده، فهرست فناوری‌های پیشنهادی، استانداردهای مدل‌سازی و کیفیت داده و برنامه‌ی اجرای مرحله‌ای."
        - title: "مهاجرت و نوسازی زیرساخت داده"
          en: "Data Platform Migration & Modernization"
          desc: "برنامه‌ریزی و هدایت انتقال سامانه‌های داده‌ی قدیمی به زیرساخت جدید، با مدیریت وقفه‌های عملیاتی و هزینه."
          outputs: ["ارزیابی وضعیت فعلی و برنامه‌ی مهاجرت مرحله‌ای", "برآورد هزینه و ریسک", "نظارت فنی بر اجرا"]
          evidence: "طراحی مسیر مهاجرت به زیرساخت ابری با حدود ۳۰٪ کاهش هزینه"
        - title: "ممیزی و بهینه‌سازی جریان‌های داده"
          en: "Pipeline Audit & Optimization"
          desc: "ارزیابی کارایی، هزینه، پایداری و کیفیت جریان‌های داده و ارائه‌ی برنامه‌ی بهبود برای افزایش سرعت و قابلیت اطمینان و کنترل هزینه."
          outputs: ["گزارش ممیزی با یافته‌های اولویت‌بندی‌شده", "پیشنهاد بهینه‌سازی کوئری‌ها و ساختار ذخیره‌سازی", "طراحی پایش سلامت و کیفیت داده"]
          evidence: "بیش از ۲۰ جریان داده‌ی عملیاتی با ۹۹٫۹٪ دسترس‌پذیری و ۴۰٪ بهبود سرعت کوئری‌ها"
        - title: "هوش تجاری و داشبوردهای مدیریتی"
          en: "BI & Executive Dashboards"
          desc: "تعریف شاخص‌ها و مدل داده و طراحی داشبوردهای مدیریتی برای پشتیبانی از تصمیم‌گیری سازمانی."
          outputs: ["تعریف شاخص‌های کلیدی عملکرد", "مدل داده‌ی معنایی یکپارچه", "داشبوردهای مدیریتی و عملیاتی"]
          evidence: "داشبوردهای Power BI مورد استفاده‌ی بیش از ۴۰ مدیر و کارشناس برای تصمیم‌های فصلی"
    - title: "هوش مصنوعی مولد و ایجنت‌ها"
      icon: "cpu"
      items:
        - title: "دستیار دانشی سازمانی (RAG)"
          en: "Enterprise Knowledge Assistant"
          desc: "توسعه‌ی دستیار مبتنی بر اسناد، آیین‌نامه‌ها و دانش داخلی که پاسخ را همراه با ارجاع به منبع ارائه می‌کند و با مدل‌های متن‌باز روی زیرساخت سازمان اجرا می‌شود."
          outputs: ["طراحی معماری و انتخاب مدل", "آماده‌سازی و ساختاردهی اسناد", "نسخه‌ی عملیاتی همراه با ارزیابی کیفیت پاسخ‌ها"]
          evidence: "طراحی پلتفرم داده‌ی حقوقی با پردازش روزانه‌ی ۵۰ هزار سند در Magna.ai"
          slug: "enterprise-knowledge-assistant"
          page:
            seoTitle: "دستیار دانشی سازمانی (RAG) روی سرورهای خود سازمان"
            intro: "پاسخ بسیاری از پرسش‌های روزمره در آیین‌نامه‌ها، قراردادها و مستندات فنی پراکنده است. دستیار دانشی سازمانی (RAG) پرسش فارسی را دریافت می‌کند، بخش‌های مرتبط را می‌یابد و پاسخ را همراه با ارجاع به منبع ارائه می‌دهد. با اجرای مدل‌های متن‌باز روی زیرساخت سازمان، اسناد در محیط داخلی باقی می‌مانند."
            signs:
              - "کارکنان برای یافتن یک بند از آیین‌نامه یا قرارداد، زمان زیادی صرف جست‌وجو یا پرسیدن از همکاران می‌کنند."
              - "واحدهای پشتیبانی، حقوقی یا منابع انسانی بارها به پرسش‌های تکراری پاسخ می‌دهند."
              - "به دلیل محرمانگی اسناد، استفاده از سرویس‌های هوش مصنوعی خارجی ممکن نیست."
              - "یک نمونه‌ی آزمایشی ساخته شده، اما پاسخ‌های آن قابل‌اعتماد نیست یا منبع را ذکر نمی‌کند."
            steps:
              - t: "شناخت اسناد و پرسش‌ها"
                d: "تعیین دامنه‌ی اسناد، کاربران و نمونه‌ای از پرسش‌های واقعی که دستیار باید به آن‌ها پاسخ دهد."
              - t: "آماده‌سازی اسناد"
                d: "استخراج متن از فایل‌ها، ساختاردهی، حذف نسخه‌های تکراری و تعیین سطح دسترسی هر سند."
              - t: "ساخت و ارزیابی"
                d: "انتخاب مدل و روش جست‌وجو، و سنجش کیفیت پاسخ‌ها با مجموعه‌ای از پرسش‌های مرجع پیش از ارائه به کاربران."
              - t: "استقرار و پایش"
                d: "راه‌اندازی روی زیرساخت سازمان، پایش کیفیت و هزینه، و به‌روزرسانی منظم با اسناد جدید."
            faq:
              - q: "آیا دستیار با اسناد فارسی به‌خوبی کار می‌کند؟"
                a: "بله. انتخاب مدل و روش جست‌وجو بر اساس عملکرد روی همان اسناد و پرسش‌های فارسی سازمان انجام می‌شود و پیش از استقرار با مجموعه‌ای از پرسش‌های واقعی سنجیده می‌شود."
              - q: "از کجا مطمئن شویم پاسخ‌ها درست است؟"
                a: "هر پاسخ همراه با ارجاع به سند و بخش مربوط ارائه می‌شود تا کاربر بتواند آن را بررسی کند. کیفیت پاسخ‌ها نیز به‌طور منظم با پرسش‌های مرجع اندازه‌گیری می‌شود."
              - q: "آیا اسناد سازمان به خارج از سازمان ارسال می‌شود؟"
                a: "خیر. مدل‌ها و داده‌ها روی سرورهای خود سازمان اجرا می‌شوند و به سرویس خارجی وابسته نیستند."
        - title: "خودکارسازی فرایندها با هوش مصنوعی ایجنتیک"
          en: "Agentic Process Automation"
          desc: "شناسایی فرایندهای تکراری و طراحی ایجنت‌هایی که با ابزارهای سازمان و در چارچوب نظارت انسانی، بخشی از کار را خودکار انجام می‌دهند."
          outputs: ["انتخاب فرایند مناسب و تعیین معیار موفقیت", "طراحی جریان کار و سطح اختیارات ایجنت", "اجرای محدود، اندازه‌گیری نتیجه و برنامه‌ی گسترش"]
          evidence: "۶۰٪ کاهش کار دستی و کاهش زمان رسیدگی به پرونده‌ها از ۴۸ به ۱۸ ساعت"
          slug: "agentic-process-automation"
          page:
            intro: "فرایندهایی مانند بررسی پرونده، تهیه‌ی گزارش، تطبیق اطلاعات و پاسخ‌گویی تکرارشونده، بخش قابل‌توجهی از زمان تیم‌ها را مصرف می‌کنند. ایجنت‌های هوش مصنوعی می‌توانند با استفاده از ابزارها و سامانه‌های موجود، بخشی از این مراحل را انجام دهند و تصمیم‌های مهم را برای تأیید به کارشناس ارجاع دهند. هدف، کاهش کار دستی و زمان انجام فرایند است."
            signs:
              - "کارشناسان بخش زیادی از وقت خود را صرف جابه‌جایی اطلاعات بین سامانه‌ها یا تهیه‌ی گزارش‌های تکراری می‌کنند."
              - "زمان رسیدگی به پرونده‌ها یا درخواست‌ها طولانی است و صف کارها کوتاه نمی‌شود."
              - "فرایند قواعد روشنی دارد، اما حجم کار بیش از ظرفیت تیم است."
              - "مدیران می‌خواهند پیش از سرمایه‌گذاری بزرگ، اثر هوش مصنوعی را روی یک فرایند مشخص اندازه بگیرند."
            steps:
              - t: "انتخاب فرایند"
                d: "شناسایی فرایندی که بیشترین اثر را دارد و تعیین معیار موفقیت، مانند زمان رسیدگی یا حجم کار دستی."
              - t: "طراحی جریان کار"
                d: "تعیین وظایف ایجنت، ابزارها و سامانه‌هایی که به آن‌ها دسترسی دارد و نقاطی که تأیید انسانی لازم است."
              - t: "اجرای محدود"
                d: "اجرای آزمایشی روی بخشی از کار واقعی، اندازه‌گیری نتیجه و اصلاح خطاها."
              - t: "گسترش و پایش"
                d: "گسترش تدریجی به حجم کامل کار، همراه با پایش کیفیت، هزینه و ثبت همه‌ی اقدام‌های ایجنت."
            faq:
              - q: "کنترل تصمیم‌ها با چه کسی است؟"
                a: "سطح اختیارات ایجنت از ابتدا تعیین می‌شود. تصمیم‌های حساس همیشه برای تأیید به کارشناس ارجاع داده می‌شوند و همه‌ی اقدام‌ها قابل بررسی است."
              - q: "از کجا بدانیم این کار برای سازمان ما نتیجه دارد؟"
                a: "کار با یک فرایند مشخص و معیار موفقیت تعریف‌شده شروع می‌شود. نتیجه‌ی اجرای محدود، پیش از هر گسترشی اندازه‌گیری و گزارش می‌شود."
              - q: "آیا به سامانه‌های فعلی سازمان دسترسی لازم است؟"
                a: "ایجنت فقط به همان بخش‌هایی دسترسی پیدا می‌کند که برای انجام کار لازم است و این دسترسی با هماهنگی واحد فناوری اطلاعات و با حداقل سطح ممکن تعریف می‌شود."
        - title: "ارزیابی، پایش و عملیاتی‌سازی مدل‌های زبانی"
          en: "LLM Evaluation & LLMOps"
          desc: "طراحی روش‌های قابل‌اندازه‌گیری برای ارزیابی کیفیت سامانه‌های مبتنی بر مدل زبانی و پایش هزینه، تأخیر و سازوکارهای محافظتی در محیط عملیاتی."
          outputs: ["مجموعه‌داده و معیارهای ارزیابی", "پایش کیفیت، هزینه و تأخیر", "سازوکارهای محافظتی و روند انتشار نسخه‌های جدید"]
          evidence: "پایه‌گذاری رویه‌ی LLMOps برای سامانه‌های ایجنتیک در بانک CIMB"
    - title: "ریسک، پایش و حاکمیت"
      icon: "shield"
      items:
        - title: "پایش مدل‌ها و مدیریت ریسک مدل"
          en: "Model Monitoring & Model Risk"
          desc: "طراحی پایش خودکار کیفیت مدل‌های اعتباری و ریسک برای بانک‌ها و مؤسسات مالی، هم‌راستا با رویه‌های اعتبارسنجی و مدیریت ریسک مدل."
          outputs: ["شاخص‌های پایداری و قدرت تفکیک (PSI/CSI، Gini/KS)", "پایش رانش داده و کالیبراسیون", "هشدار خودکار و گزارش دوره‌ای برای مالکان مدل"]
          evidence: "پایش خودکار عملکرد مدل‌ها برای واحد ریسک گروه در بانک CIMB"
          slug: "model-monitoring"
          page:
            intro: "تغییر رفتار مشتریان و شرایط اقتصادی می‌تواند کیفیت مدل‌های اعتبارسنجی، ریسک و تقلب را پس از استقرار کاهش دهد. پایش خودکار، شاخص‌های عملکرد را به‌طور منظم محاسبه می‌کند و در صورت عبور از آستانه‌های تعیین‌شده، به مالک مدل هشدار می‌دهد تا عملکرد جاری مدل مبنای ارزیابی قرار گیرد."
            signs:
              - "عملکرد مدل‌ها فقط سالی یک بار یا هنگام اعتبارسنجی بررسی می‌شود."
              - "گزارش‌های پایش به‌صورت دستی و با صرف زمان زیاد تهیه می‌شوند."
              - "واحد ریسک یا نهاد ناظر، مستندات منظم از کیفیت مدل‌ها درخواست می‌کند."
