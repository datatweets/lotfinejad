slug: software-engineering
en: "Software Engineering Fundamentals"
fa: "مبانی مهندسی نرم‌افزار"
level: "مقدماتی تا متوسط"
summary: "یادگیری ساخت نرم‌افزاری که با رشد پروژه قابل نگهداری بماند: اصول پایه، SOLID، معماری، الگوهای طراحی، کد تمیز، آزمون، BDD، CI/CD و امنیت؛ همه در قالب یک پروژه‌ی واقعی."
project: "پروژه‌ی Ledgerly، از برنامه‌ریزی تا تحویل"
outcomes:
  - "تقسیم یک برنامه‌ی کارا به ماژول‌هایی با مسئولیت‌های روشن"
  - "به‌کارگیری اصول SOLID و الگوهای طراحی رایج در جای مناسب"
  - "نوشتن کد آزموده و استفاده از آزمون‌ها برای تغییر ایمن کد"
  - "طراحی معماری اپلیکیشن پیش از آنکه از کنترل خارج شود"
  - "مدیریت ملاحظات تحویل و عملیات: بسته‌بندی، پیکربندی و CI"
prereqs:
  - "تسلط بر پایتون، از جمله کلاس‌ها"
  - "تجربه‌ی نوشتن برنامه‌هایی بزرگ‌تر از یک اسکریپت ساده"
tools: ["Python 3", "pytest"]
modules:
  - t: "مبانی مهندسی"
    l: ["اصول پایه‌ی مهندسی نرم‌افزار", "اصول SOLID", "چرخه‌ی عمر توسعه‌ی نرم‌افزار", "روش‌شناسی‌های توسعه", "پروژه‌ی راهنمادار: برنامه‌ریزی پروژه‌ی Ledgerly"]
  - t: "طراحی، معماری و برنامه‌نویسی شیءگرا"
    l: ["طراحی و معماری نرم‌افزار", "برنامه‌نویسی شیءگرا در عمل", "الگوهای طراحی ۱: الگوهای ایجادی و ساختاری", "الگوهای طراحی ۲: الگوهای رفتاری", "پروژه‌ی راهنمادار: معماری دامنه‌ی Ledgerly"]
  - t: "نوشتن کد باکیفیت و آزموده"
    l: ["کد تمیز و بهترین روش‌ها", "مبانی آزمون نرم‌افزار", "توسعه‌ی رفتارمحور (BDD)", "زبان Gherkin", "پروژه‌ی راهنمادار: آزمون Ledgerly با BDD"]
  - t: "تحویل و عملیات"
    l: ["مبانی کنترل نسخه", "CI/CD و DevOps", "بهترین روش‌های امنیتی", "پروژه‌ی راهنمادار: تحویل ایمن Ledgerly"]
  - t: "پروژه‌ی پایانی"
    l: ["پروژه‌ی راهنمادار: Ledgerly به‌طور کامل"]
