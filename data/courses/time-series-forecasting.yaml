slug: time-series-forecasting
en: "Time Series Forecasting"
fa: "پیش‌بینی سری‌های زمانی"
level: "متوسط"
summary: "پیش‌بینی آینده بر اساس داده‌های گذشته با روش‌های آماری کلاسیک: تجزیه‌ی سری، ایستایی، ARIMA و SARIMA، هموارسازی نمایی و ارزیابی صادقانه با آزمون روی داده‌های گذشته، همراه با تمرین عملی در پایتون."
project: "یک پیش‌بینی کامل، از تجزیه‌ی سری تا ارزیابی روی داده‌های گذشته"
outcomes:
  - "شناخت تفاوت داده‌های زمانی با داده‌های جدولی معمولی"
  - "تجزیه‌ی سری زمانی به روند، فصلی‌بودن و باقیمانده"
  - "آزمون ایستایی و تفاضل‌گیری تا رسیدن به سری قابل مدل‌سازی"
  - "خواندن نمودارهای ACF و PACF برای انتخاب مدل‌های AR، MA، ARIMA و SARIMA"
  - "ارزیابی صادقانه‌ی پیش‌بینی روی داده‌هایی که مدل پیش‌تر ندیده است"
prereqs:
  - "تسلط بر پایتون و pandas"
  - "آمار مقدماتی: توزیع، واریانس و همبستگی"
tools: ["statsmodels", "pandas", "NumPy", "scikit-learn"]
modules:
  - t: "مبانی سری‌های زمانی"
    l: ["چه چیزی سری زمانی را متمایز می‌کند", "اندیس زمانی و نمونه‌برداری مجدد", "بررسی و مصورسازی سری", "تقسیم سری زمانی و مدل‌های پایه", "پروژه‌ی راهنمادار: آشنایی با سری Cyclepath"]
  - t: "مؤلفه‌ها و تجزیه‌ی سری"
    l: ["روند، فصلی‌بودن و باقیمانده", "تجزیه‌ی کلاسیک به‌صورت دستی", "مدل‌های جمعی در برابر ضربی", "تجزیه‌ی STL", "پروژه‌ی راهنمادار: تجزیه‌ی سری Cyclepath"]
  - t: "ایستایی و تفاضل‌گیری"
    l: ["ایستایی چیست؟", "آزمون دیکی–فولر تعمیم‌یافته", "تفاضل‌گیری برای حذف روند", "تفاضل‌گیری فصلی و تبدیل‌ها", "پروژه‌ی راهنمادار: ایستاسازی سری Cyclepath"]
  - t: "خودهمبستگی: ACF و PACF"
    l: ["ACF و PACF چه چیزی را می‌سنجند", "خواندن الگوها: AR در برابر MA", "باندهای اطمینان و آزمون‌های چندگانه", "خواندن ACF و PACF سری Cyclepath", "انتخاب مرتبه‌های ARIMA برای Cyclepath"]
  - t: "مدل‌های AR، MA، ARMA و ARIMA"
    l: ["مدل خودرگرسیو (AR)", "مدل میانگین متحرک (MA)", "ARMA و ARIMA: ترکیب و تفاضل‌گیری", "برازش و پیش‌بینی ARIMA با statsmodels", "پروژه‌ی راهنمادار: پیش‌بینی Cyclepath با ARIMA"]
  - t: "فصلی‌بودن: مدل SARIMA"
    l: ["از ARIMA تا SARIMA", "جمله‌های AR و MA فصلی", "برازش SARIMA با statsmodels", "عیب‌یابی: آیا مدل کافی است؟", "پروژه‌ی راهنمادار: پیش‌بینی Cyclepath با SARIMA"]
  - t: "هموارسازی نمایی"
    l: ["هموارسازی نمایی ساده", "روش روند خطی هولت", "روش فصلی هولت–وینترز", "برازش، مقایسه و انتخاب پیکربندی", "پروژه‌ی راهنمادار: مقایسه‌ی هولت–وینترز و SARIMA"]
  - t: "ارزیابی و آزمون روی داده‌های گذشته"
    l: ["چرا یک تقسیم داده کافی نیست", "اعتبارسنجی پیش‌رونده (Walk-Forward)", "TimeSeriesSplit و رسمی‌کردن حلقه‌ی ارزیابی", "بازه‌های پیش‌بینی و میزان اعتبار آن‌ها", "پروژه‌ی راهنمادار: ارزیابی همه‌ی مدل‌ها روی داده‌های گذشته"]
  - t: "پروژه‌ی پایانی"
    l: ["آشنایی با سری Lantern & Vine", "روندی که سرعتش تغییر می‌کند", "ایستاسازی و خواندن خودهمبستگی", "برازش و ارزیابی مدل‌های پیشنهادی", "پروژه‌ی راهنمادار: گزارش نهایی"]
