slug: streamlit-for-data-apps
en: "Streamlit for Data Apps"
fa: "ساخت اپلیکیشن داده با Streamlit"
level: "مقدماتی تا متوسط"
summary: "ساخت اپلیکیشن‌های داده‌ی تعاملی با Streamlit؛ از اولین ابزار تعاملی تا یک داشبورد کامل روی داده‌های واقعی Gapminder، همراه با مصورسازی، چیدمان، آزمون، ارائه و انتشار آنلاین."
project: "World Development Explorer؛ یک داشبورد چندصفحه‌ای واقعی"
outcomes:
  - "ساخت و اجرای اپلیکیشن‌های Streamlit و درک دقیق اینکه چرا کل اسکریپت با هر تعامل دوباره اجرا می‌شود"
  - "بارگذاری، کش‌کردن، فیلتر و مصورسازی داده با Plotly، Altair و نمودارهای داخلی Streamlit"
  - "ساخت اپلیکیشن چندصفحه‌ای با فرم، بارگذاری فایل و الگوهای جدید ناوبری"
  - "آزمون اپلیکیشن با AppTest، بهینه‌سازی کارایی و انتشار آنلاین روی Streamlit Community Cloud"
  - "ارائه‌ی نتایج با نمودارهای matplotlib و seaborn، خروجی CSV، طراحی ظاهر سفارشی و نمادگذاری ریاضی LaTeX"
prereqs:
  - "آشنایی مقدماتی با پایتون: متغیر، تابع و خواندن DataFrame در pandas"
  - "نیازی به تجربه‌ی توسعه‌ی وب نیست؛ در این دوره از HTML، CSS یا JavaScript استفاده نمی‌شود"
  - "آشنایی با خط فرمان و یک ویرایشگر کد"
tools: ["Streamlit", "Python", "pandas", "Plotly", "Altair", "Matplotlib / Seaborn"]
modules:
  - t: "شروع کار با Streamlit"
    l: ["Streamlit چیست", "اولین ویجت‌های تعاملی", "مدل اجرای مجدد (Rerun)", "Session State", "پروژه‌ی راهنمادار: اولین اپلیکیشن داده‌ی واقعی"]
  - t: "کار با داده‌های واقعی"
    l: ["بارگذاری و کش‌کردن داده", "نمایش و ویرایش DataFrame", "ساخت پنل‌های فیلتر", "اشکال‌زدایی و روند کار توسعه", "پروژه‌ی راهنمادار: کاوشگر کشورها با قابلیت فیلتر"]
  - t: "مصورسازی داده در Streamlit"
    l: ["نمودارهای داخلی Streamlit", "نمودارهای تعاملی با Plotly", "نمودارهای اعلانی با Altair", "نقشه و داده‌های جغرافیایی", "پروژه‌ی راهنمادار: تبدیل اپلیکیشن به داشبورد"]
  - t: "چیدمان، ساختار و اپلیکیشن چندصفحه‌ای"
    l: ["اجزای پایه‌ی چیدمان", "تنظیمات صفحه", "اپلیکیشن چندصفحه‌ای به روش جدید", "فرم‌ها و بارگذاری فایل", "پروژه‌ی راهنمادار: تبدیل به یک اپلیکیشن چندصفحه‌ای واقعی"]
  - t: "آزمون، کارایی و انتشار"
    l: ["آزمون اپلیکیشن Streamlit با AppTest", "کارایی: راهبرد کش و Fragmentها", "اطلاعات محرمانه و پیکربندی", "انتشار روی Streamlit Community Cloud", "پروژه‌ی راهنمادار: آماده‌سازی برای انتشار"]
  - t: "ارائه‌ی نتایج"
    l: ["Matplotlib و Seaborn با st.pyplot", "خروجی‌گرفتن از نتایج با st.download_button", "طراحی ظاهر سفارشی با config.toml", "LaTeX برای ریاضی و آمار", "پروژه‌ی راهنمادار: گزارش آماده‌ی ارائه"]
  - t: "پروژه‌ی پایانی"
    l: ["نسخه‌ی کامل World Development Explorer"]
