faq:
  - q: "اگر داده‌های سازمان هنوز منظم نیست، آیا امکان شروع همکاری وجود دارد؟"
    a: "بله. ارزیابی اولیه مشخص می‌کند کدام داده‌ها آماده‌اند و پیش از اجرای راهکار، چه اقدام‌هایی برای آماده‌سازی لازم است."
  - q: "آیا بدون دسترسی به سرویس‌های خارجی می‌توان از هوش مصنوعی استفاده کرد؟"
    a: "بله. می‌توان مدل‌های متن‌باز را روی زیرساخت سازمان اجرا کرد و وابستگی به سرویس‌های خارجی را کاهش داد."
  - q: "هزینه‌ی همکاری چگونه تعیین می‌شود؟"
    a: "هزینه بر اساس دامنه‌ی کار، مدت همکاری و منابع موردنیاز تعیین می‌شود. شرح کار، زمان‌بندی و برآورد هزینه پیش از آغاز همکاری ارائه خواهد شد."
  - q: "چگونه از اطلاعات سازمان محافظت می‌شود؟"
    a: "محرمانگی اطلاعات در تمام مراحل رعایت می‌شود. در صورت نیاز، قرارداد عدم افشای اطلاعات پیش از آغاز همکاری تنظیم می‌شود."
  - q: "دوره‌های آموزشی چگونه برگزار می‌شوند؟"
    a: "دوره‌ها به زبان فارسی و به‌صورت حضوری در محل سازمان یا آنلاین برگزار می‌شوند. فهرست دوره‌ها در صفحه‌ی «دوره‌ها» در دسترس است."

closing:
  title: "مسیر مناسب را در یک جلسه‌ی مشاوره بررسی کنید"
  text: "برای ارزیابی نیاز سازمان، برنامه‌ریزی آموزش یا بررسی یک پروژه، درخواست جلسه را ثبت کنید. پس از بررسی درخواست، برای هماهنگی زمان جلسه با شما تماس گرفته می‌شود."
