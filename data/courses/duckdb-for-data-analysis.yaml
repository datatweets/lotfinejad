slug: duckdb-for-data-analysis
en: "DuckDB for Data Analysis"
fa: "تحلیل داده با DuckDB"
level: "مقدماتی تا متوسط"
summary: "آموزش تحلیل داده با SQL و DuckDB در محیط محلی؛ از اجرای پرس‌وجو روی فایل‌های CSV تا کار با Join، JSON و داده‌های راه دور، ساخت داشبورد و اجرای پروژه‌ی پایانی."
project: "جریان کامل تحلیل داده با DuckDB برای فروشگاه Thistlewood Goods"
outcomes:
  - "نصب و اجرای DuckDB از خط فرمان و پایتون روی هر سیستم‌عامل"
  - "اجرای کوئری SQL مستقیماً روی فایل‌های CSV، JSON و Parquet، بدون بارگذاری و بدون سرور پایگاه داده"
  - "Join، تجمیع و تحلیل کارایی کوئری‌ها با توابع پنجره‌ای و EXPLAIN"
  - "ساخت اپلیکیشن‌ها و داشبوردهای داده‌ی محلی با Streamlit و Apache Superset"
prereqs:
  - "برای بخش‌های ۱ تا ۶ نیازی به پایتون نیست؛ از بخش ۷ به بعد آشنایی مقدماتی با پایتون توصیه می‌شود"
  - "نیازی به تجربه‌ی قبلی SQL یا پایگاه داده نیست؛ SQL لازم در طول دوره آموزش داده می‌شود"
  - "آشنایی با خط فرمان و یک ویرایشگر کد"
  - "Docker فقط برای دو درس از بخش ۱۰ لازم است"
tools: ["DuckDB", "SQL", "Python", "Streamlit", "Apache Superset", "Docker"]
modules:
  - t: "آشنایی با DuckDB"
    l: ["چرا DuckDB؟ تحلیل سریع با SQL جاسازی‌شده", "مقایسه‌ی DuckDB با Postgres، SQLite و pandas", "نصب DuckDB (خط فرمان و پایتون) و اتصال", "اولین کوئری‌ها روی یک فایل واقعی", "رابط کاربری DuckDB: بررسی بصری داده", "پروژه‌ی راهنمادار: بررسی کامل یک فایل CSV"]
  - t: "مبانی SQL به روش DuckDB"
    l: ["جدول‌ها، سطرها و انواع داده", "فیلتر و مرتب‌سازی با WHERE و ORDER BY", "تجمیع با GROUP BY", "Join کردن جدول‌ها", "CTE و زیرکوئری", "پروژه‌ی راهنمادار: پاسخ به پرسش‌های کسب‌وکار با SQL"]
  - t: "خواندن مستقیم فایل‌ها: CSV، Parquet و چندین فایل"
    l: ["کوئری روی CSV بدون بارگذاری", "Parquet: قالب محبوب DuckDB", "خواندن هم‌زمان چندین فایل با الگوهای Glob", "تشخیص خودکار Schema و زمان تعیین دستی آن", "خروجی‌گرفتن از نتایج با COPY", "پروژه‌ی راهنمادار: اسکریپت دریافت داده از چندین فایل"]
  - t: "ماندگاری داده: حافظه در برابر فایل پایگاه داده"
    l: ["پایگاه داده‌ی درون‌حافظه‌ای در برابر ماندگار", "بارگذاری داده در جدول‌ها", "View در برابر جدول", "کار با چند پایگاه داده (ATTACH)", "پروژه‌ی راهنمادار: ساخت پایگاه داده‌ی تحلیلی محلی"]
  - t: "کار با JSON و داده‌های تودرتو"
    l: ["خواندن مستقیم فایل‌های JSON", "کوئری روی Struct و List در SQL", "تبدیل JSON تودرتو به جدول", "ذخیره‌ی نتایج به‌صورت JSON", "پروژه‌ی راهنمادار: ساختاردهی یک خروجی تودرتو"]
  - t: "SQL پیشرفته برای تحلیل"
    l: ["توابع پنجره‌ای: ROW_NUMBER، RANK و سایر توابع", "جمع تجمعی و میانگین متحرک", "PIVOT و UNPIVOT", "توابع تاریخ و زمان", "پروژه‌ی راهنمادار: گزارش تحلیل فروش"]
  - t: "DuckDB در اکوسیستم پایتون"
    l: ["API پایتون: اتصال‌ها و Relationها", "کوئری مستقیم روی DataFrameهای pandas و Polars", "دریافت نتایج به‌صورت pandas، Polars یا Arrow", "اسکریپت یا خط فرمان: کدام و کی؟", "پروژه‌ی راهنمادار: جریان پردازش پایتونی مبتنی بر DuckDB"]
  - t: "کوئری روی داده‌های راه دور و بزرگ‌تر از حافظه"
    l: ["افزونه‌ی httpfs: کوئری روی فایل‌ها از طریق HTTP و S3", "Parquet پارتیشن‌بندی‌شده و Predicate Pushdown", "خواندن مستقیم یک مجموعه‌داده‌ی عمومی از URL", "مدیریت داده‌های بزرگ‌تر از RAM", "پروژه‌ی راهنمادار: کوئری روی فایل راه دور بدون دانلود"]
  - t: "کارایی و تحلیل اجرای کوئری"
    l: ["EXPLAIN و خواندن طرح اجرای کوئری", "راز سرعت DuckDB: اجرای ستونی و برداری", "ایندکس و ترتیب: چه زمانی واقعاً کمک می‌کنند", "تحلیل و رفع یک کوئری کند", "پروژه‌ی راهنمادار: افزایش سرعت یک گزارش واقعی"]
  - t: "ساخت اپلیکیشن و داشبورد داده‌ی محلی"
    l: ["از کوئری تا اپلیکیشن: اپلیکیشن داده‌ی محلی چیست", "داشبورد محلی با Streamlit و DuckDB", "تبدیل یک کوئری به ابزار خط فرمان قابل استفاده‌ی دوباره", "نصب Apache Superset با Docker و اتصال به DuckDB", "پروژه‌ی راهنمادار: ساخت یک داشبورد واقعی در Superset"]
  - t: "پروژه‌ی پایانی"
    l: ["پروژه‌ی پایانی: جریان تحلیل داده با DuckDB برای Thistlewood Goods"]
