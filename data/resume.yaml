achievements:
  - "رهبری راهکارهای ایجنتیک تحلیل ریسک و پایش مدل روی Azure Fabric در CIMB، با LangChain، LangGraph و Rayfin برای خودکارسازی بررسی ریسک و نظارت بر عملکرد مدل‌ها."
  - "رهبری راهکارهای داده و تحلیل سازمانی برای مشتریانی مانند CIMB، Petronas، Shell، TNB و تیم‌های کسب‌وکار منطقه‌ای."
  - "پردازش روزانه‌ی بیش از ۲ ترابایت داده‌ی مخابراتی در محیط‌های چندمنطقه‌ای AWS با Databricks، Apache Spark، Redshift، S3، Athena و Lambda."
  - "ساخت و راهبری بیش از ۲۰ پایپ‌لاین داده و جریان کاری BI با دسترس‌پذیری ۹۹٫۹٪ برای تحلیلگران در ۹ بازار منطقه‌ای."
  - "معماری زیرساخت داده‌ی حقوقی مبتنی بر هوش مصنوعی برای بیش از ۱۰ هزار درخواست تحلیل پرونده و ۵۰ هزار سند حقوقی در روز."
  - "کاهش ۶۰ درصدی مداخله‌ی دستی در فرایندهای حقوقی و کوتاه‌کردن زمان رسیدگی به پرونده از ۴۸ به ۱۸ ساعت با خودکارسازی جریان کار."
  - "آموزش بیش از ۵۰۰ متخصص در کشورهای آسه‌آن در دوره‌های دارای اعتبار HRDF در علم داده، Python، تحلیل ابری و کلان‌داده."

