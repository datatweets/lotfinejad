{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}
<div class="grid">
  {{ range .Pages }}
    <a class="card" href="{{ .RelPermalink }}">
      <h3>{{ .Title }}</h3>
      {{ with .Params.date }}<p class="meta bidi-num">{{ .Format "2006-01-02" }}</p>{{ end }}
      {{ with .Summary }}<p>{{ . }}</p>{{ end }}
    </a>
  {{ end }}
</div>
{{ end }}
