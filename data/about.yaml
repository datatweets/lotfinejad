# FAQ on the About page. Shown on the page AND emitted as FAQPage JSON-LD,
# so the visible text and the structured data must stay identical (both
# come from this file). Written to answer the name-based questions people
# actually search for, using only facts stated elsewhere on the site.
faq:
  - q: "محمدمهدی لطفی نژاد کیست؟"
    a: "محمدمهدی لطفی نژاد مشاور و مدرس داده و هوش مصنوعی است. او بیش از ۱۵ سال در زمینه‌ی مهندسی داده، یادگیری ماشین و مدل‌های زبانی بزرگ کار کرده و در سازمان‌هایی مانند CIMB، Petronas، Shell، TNB و Axiata پروژه‌های داده و هوش مصنوعی را هدایت کرده است. او همچنین با نام‌های مهدی لطفی نژاد و Mehdi Lotfinejad شناخته می‌شود."
  - q: "تخصص محمدمهدی لطفی نژاد چیست؟"
    a: "حوزه‌های اصلی تخصص او هوش مصنوعی (از جمله RAG، ایجنت‌ها و ارزیابی مدل‌های زبانی)، مهندسی داده و رهبری فنی است. تمرکز کارهای او بر مدل‌های متن‌باز و زیرساخت‌هایی است که روی سرورهای خود سازمان اجرا می‌شوند."
  - q: "آیا محمدمهدی لطفی نژاد مشاوره‌ی هوش مصنوعی و داده ارائه می‌دهد؟"
    a: "بله. مشاوره در طراحی و پیاده‌سازی پلتفرم‌های داده و سامانه‌های هوش مصنوعی برای سازمان‌ها ارائه می‌شود. فهرست خدمات در صفحه‌ی خدمات آمده و درخواست جلسه‌ی مشاوره از همان بخش انجام می‌شود."
  - q: "آیا محمدمهدی لطفی نژاد دوره‌ی آموزشی هوش مصنوعی برگزار می‌کند؟"
    a: "بله. دوره‌های جامع حضوری و آنلاین داده و هوش مصنوعی به زبان فارسی برای تیم‌های فنی برگزار می‌شود. فهرست دوره‌ها و سرفصل‌ها در صفحه‌ی دوره‌ها قرار دارد."
  - q: "رزومه‌ی محمدمهدی لطفی نژاد کجا قابل مشاهده است؟"
    a: "رزومه‌ی کامل او، شامل سوابق کاری، تحصیلات، گواهی‌نامه‌ها و انتشارات، در صفحه‌ی رزومه و به‌صورت PDF در دسترس است."
