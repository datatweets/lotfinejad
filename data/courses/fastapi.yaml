slug: fastapi
en: "FastAPI: Build Production APIs in Python"
fa: "ساخت API با FastAPI"
level: "مقدماتی تا متوسط"
summary: "یادگیری FastAPI از اولین Endpoint تا یک API آزموده و مستقرشده: پارامترهای مسیر و پرس‌وجو، اعتبارسنجی با Pydantic، پایگاه داده، احراز هویت و استقرار؛ همه به‌صورت عملی."
project: "یک API کامل و قابل استقرار برای مدیریت وظایف"
outcomes:
  - "ساخت API مبتنی بر HTTP با پارامترهای مسیر، پرس‌وجو و بدنه‌ی درخواست دارای نوع مشخص"
  - "اعتبارسنجی درخواست‌ها و پاسخ‌ها با Pydantic به‌جای بررسی‌های دست‌نویس"
  - "ذخیره‌ی داده با SQLModel و ساختاردهی اپلیکیشن در حال رشد با Router و وابستگی‌ها"
  - "افزودن احراز هویت، پردازش‌های پس‌زمینه و پاسخ جریانی"
  - "آزمون و استقرار API"
prereqs:
  - "تسلط بر پایتون: تابع، کلاس و Type Hint"
  - "نیازی به تجربه‌ی قبلی توسعه‌ی وب یا API نیست"
tools: ["FastAPI", "Pydantic", "SQLModel", "pwdlib & PyJWT", "pytest"]
modules:
  - t: "شروع کار با FastAPI"
    l: ["FastAPI چیست و چرا سریع است", "اولین API", "پارامترهای مسیر", "پارامترهای پرس‌وجو", "پروژه‌ی راهنمادار: API فقط‌خواندنی مدیریت وظایف"]
  - t: "بدنه‌ی درخواست و Pydantic"
    l: ["بدنه‌ی درخواست با Pydantic", "اعتبارسنجی فیلدها و محدودیت‌ها", "مدل‌های تودرتو و پیچیده", "مدل‌های پاسخ", "پروژه‌ی راهنمادار: API وظایف با اعتبارسنجی"]
  - t: "HTTP به روش درست: وضعیت، خطا، فرم و فایل"
    l: ["کدهای وضعیت و انواع پاسخ", "مدیریت خطا", "سرآیندها، کوکی‌ها و فرم‌ها", "کار با فایل‌ها", "پروژه‌ی راهنمادار: Endpointهای پایدار برای وظایف"]
  - t: "ساختار، وابستگی‌ها و Middleware"
    l: ["تزریق وابستگی", "وابستگی‌های قابل استفاده‌ی دوباره و تودرتو", "اپلیکیشن‌های بزرگ‌تر با Router", "Middleware و CORS", "پروژه‌ی راهنمادار: اپلیکیشن ماژولار"]
  - t: "پایگاه داده با SQLModel"
    l: ["اتصال به پایگاه داده", "مدل‌ها و جدول‌ها", "عملیات CRUD: ایجاد و خواندن", "عملیات CRUD: به‌روزرسانی و حذف", "پروژه‌ی راهنمادار: API وظایف با ذخیره‌سازی ماندگار"]
  - t: "احراز هویت و امنیت"
    l: ["گام‌های نخست امنیت", "هش‌کردن گذرواژه و کاربر جاری", "توکن‌های دسترسی JWT", "محافظت از مسیرها و سطوح دسترسی", "پروژه‌ی راهنمادار: API محافظت‌شده با احراز هویت"]
  - t: "برنامه‌نویسی ناهمگام، پردازش پس‌زمینه و پاسخ جریانی"
    l: ["async و هم‌روندی", "وظایف پس‌زمینه", "پاسخ جریانی و Server-Sent Events", "WebSocket", "پروژه‌ی راهنمادار: Endpoint جریانی"]
  - t: "آزمون، تنظیمات، استقرار و پروژه‌ی پایانی"
    l: ["آزمون با pytest", "پیکربندی و اطلاعات محرمانه", "مستندات، فراداده و استقرار", "پروژه‌ی پایانی: ساخت API کامل", "پروژه‌ی پایانی: آزمون و استقرار"]
