slug: ab-testing
en: "A/B Testing & Experimentation"
fa: "آزمون A/B و طراحی آزمایش"
level: "متوسط"
summary: "آموزش طراحی و تحلیل آزمایش‌های کنترل‌شده، از تصادفی‌سازی و توان آزمون تا تعیین حجم نمونه و تحلیل نسبت‌ها و میانگین‌ها؛ همراه با تمرین عملی در پایتون و بررسی خطاهایی که اعتبار نتیجه را کاهش می‌دهند."
project: "طراحی و تحلیل کامل یک آزمایش"
outcomes:
  - "طراحی آزمایش کنترل‌شده‌ای که دقیقاً به پرسش مطرح‌شده پاسخ دهد"
  - "محاسبه‌ی حجم نمونه و توان آزمون پیش از اجرای آزمایش"
  - "تحلیل شاخص‌های نرخ تبدیل و درآمد با آزمون مناسب هر کدام"
  - "شناخت خطاهایی که نتیجه را بی‌اعتبار می‌کنند؛ مانند نگاه زودهنگام به نتایج، مقایسه‌های چندگانه و تصادفی‌سازی معیوب"
prereqs:
  - "تسلط بر پایتون و pandas"
  - "آمار مقدماتی: توزیع، میانگین و واریانس (مطالب دوره‌ی آمار و احتمال کافی است)"
tools: ["Python 3", "NumPy", "SciPy"]
modules:
  - t: "منطق آزمایش"
    l: ["چرا آزمایش انجام می‌دهیم", "گروه کنترل و گروه آزمایش", "چرا تصادفی‌سازی جواب می‌دهد", "ساختار یک آزمون A/B", "پروژه‌ی راهنمادار: اولین آزمایش روی محصول Lumen"]
  - t: "طراحی آزمایش"
    l: ["از پرسش تا فرضیه", "انتخاب شاخص‌ها", "واحد تصادفی‌سازی", "کمینه‌ی اثر قابل تشخیص", "پروژه‌ی راهنمادار: طراحی آزمایش قیمت‌گذاری Lumen"]
  - t: "توان آزمون و حجم نمونه"
    l: ["سطح معناداری و دو نوع خطا", "توان آماری", "محاسبه‌ی حجم نمونه", "منحنی توان و شبیه‌سازی", "پروژه‌ی راهنمادار: تعیین حجم نمونه‌ی آزمایش Lumen"]
  - t: "تحلیل شاخص‌های نسبتی"
    l: ["آزمون Z دو نسبت", "تفسیر مقدار p", "بازه‌ی اطمینان برای تفاوت", "تصمیم‌گیری برای انتشار تغییر", "پروژه‌ی راهنمادار: تحلیل آزمایش ثبت‌نام Lumen"]
  - t: "تحلیل شاخص‌های میانگین"
    l: ["آزمون t دو نمونه‌ای", "آزمون t ولش و واریانس‌های نابرابر", "شاخص‌های چوله و آزمون من–ویتنی", "بازه‌ی اطمینان برای تفاوت میانگین‌ها", "پروژه‌ی راهنمادار: آزمایش درآمد Lumen"]
  - t: "خطاها و اعتبار نتایج"
    l: ["نگاه زودهنگام و توقف اختیاری", "مقایسه‌های چندگانه", "پارادوکس سیمپسون", "بررسی‌های صحت و تهدیدهای اعتبار", "پروژه‌ی راهنمادار: ممیزی یک آزمایش Lumen"]
  - t: "فراتر از آزمون A/B پایه"
    l: ["کاهش واریانس با CUPED", "آزمون ترتیبی", "آزمون A/B بیزی", "راهزن‌های چنددسته (Multi-Armed Bandit)", "پروژه‌ی راهنمادار: آزمایشی هوشمندتر برای Lumen"]
  - t: "پروژه‌ی پایانی"
    l: ["شرح مسئله و طراحی آزمایش", "اجرا و اعتبارسنجی آزمایش", "تحلیل نتایج", "بررسی متقابل و تصمیم‌گیری", "گزارش کامل نتایج و جمع‌بندی دوره"]
