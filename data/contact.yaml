# Smart contact form (layouts/partials/smart-form.html), used on /contact/ and
# /consultation/. Each intent switches the visible fields, email subject,
# button, success message and the "after you send" steps.
# The intent is picked from the link (?type=, ?course=, ?service=), then the
# referring page, then a saved draft, then the page default.
eyebrow: "تماس"
title: "ارسال درخواست یا پیام"
lead: >-
  موضوع را انتخاب کنید تا فرم متناسب با آن تنظیم شود. پیام‌ها و درخواست‌ها مستقیم بررسی می‌شوند
  و پاسخ از طریق ایمیل یا تلفن ارسال می‌شود.

intents:
  - key: "message"
    msgLabel: "متن پیام"
    msgPlaceholder: "پیام خود را بنویسید."
    msgRequired: true
    orgRequired: false
    label: "پیام عمومی"
    hint: "پرسش، پیشنهاد همکاری یا هر موضوع دیگر"
    icon: "mail"
    subject: "پیام از وب‌سایت"
    submit: "ارسال پیام"
    done: "پیام شما ارسال شد. در اولین فرصت از طریق ایمیل پاسخ داده می‌شود."
    steps:
      - "پیام شما خوانده می‌شود."
      - "پاسخ از طریق ایمیل برای شما ارسال می‌شود."
  - key: "consulting"
    msgLabel: "شرح نیاز"
    msgPlaceholder: "به‌طور خلاصه بنویسید سازمان در چه وضعیتی است، چه مسئله‌ای باید حل شود و چه انتظاری از جلسه دارید."
    msgRequired: true
    orgRequired: true
    label: "جلسه‌ی مشاوره"
    hint: "جلسه‌ی مشاوره رایگان ۲۰ دقیقه‌ای"
    icon: "people"
    subject: "درخواست جلسه‌ی مشاوره"
    submit: "ارسال درخواست مشاوره"
    done: "درخواست مشاوره ثبت شد. برای تعیین زمان جلسه‌ی مشاوره در اولین فرصت با شما تماس گرفته می‌شود."
    steps:
      - "درخواست شما بررسی و برای تعیین زمان جلسه با شما تماس گرفته می‌شود."
      - "در جلسه‌ی مشاوره (آنلاین)، نیازها، شرایط و اهداف سازمان مرور می‌شود."
      - "مسیر پیشنهادی و گام بعدی با شما در میان گذاشته می‌شود."
  - key: "project"
    msgLabel: "شرح پروژه"
    msgPlaceholder: "هدف پروژه، کاربران نهایی، سامانه‌ها و داده‌های مرتبط و هر محدودیتی که باید در نظر گرفته شود."
    msgRequired: true
    orgRequired: true
    label: "اجرای پروژه"
    hint: "طراحی و پیاده‌سازی راهکار داده یا هوش مصنوعی"
    icon: "cpu"
    subject: "درخواست اجرای پروژه"
    submit: "ارسال درخواست پروژه"
    done: "درخواست پروژه ثبت شد. پس از بررسی، برای شناخت دقیق‌تر نیاز و شرایط پروژه با شما تماس گرفته می‌شود."
    steps:
      - "شرح پروژه و وضعیت داده‌ها بررسی می‌شود."
      - "در یک جلسه، دامنه، خروجی‌ها و شرایط پروژه روشن می‌شود."
      - "برنامه‌ی اجرا و زمان‌بندی با شما هماهنگ می‌شود."
  - key: "course"
    msgLabel: "توضیحات"
    msgPlaceholder: "هدف از برگزاری دوره، ابزارهایی که تیم با آن‌ها کار می‌کند یا هر نکته‌ی دیگری که در طراحی دوره کمک می‌کند."
    msgRequired: false
    orgRequired: true
    label: "برگزاری دوره"
    hint: "دوره‌ی حضوری یا آنلاین برای تیم سازمان"
    icon: "doc"
    subject: "درخواست برگزاری دوره"
    submit: "ثبت درخواست دوره"
    done: "درخواست دوره ثبت شد. برای نیازسنجی و هماهنگی جزئیات دوره در اولین فرصت با شما تماس گرفته می‌شود."
    steps:
      - "درخواست شما بررسی می‌شود."
      - "برای نیازسنجی و شناخت سطح تیم با شما تماس گرفته می‌شود."
      - "سرفصل، مدت و تمرین‌های دوره متناسب با نیاز تیم شما تنظیم می‌شود."

