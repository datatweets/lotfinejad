slug: machine-learning
en: "Machine Learning"
fa: "یادگیری ماشین"
level: "مقدماتی تا پیشرفته"
summary: "آموزش جامع یادگیری ماشین از مبانی ریاضی تا یادگیری عمیق، همراه با تمرین عملی در پایتون."
project: "کار با داده‌های واقعی و پروژه‌های راهنمادار"
outcomes:
  - "ساخت، ارزیابی و تنظیم مدل‌های نظارت‌شده برای رگرسیون و طبقه‌بندی"
  - "ساخت ویژگی و بهینه‌سازی مدل، به‌جای پذیرفتن اولین نتیجه"
  - "به‌کارگیری مدل‌های درختی ترکیبی و روش‌های بدون نظارت روی داده‌های واقعی"
  - "آموزش شبکه‌های عصبی با PyTorch و TensorFlow"
  - "کار با تصویر، داده‌های ترتیبی و متن با CNN، RNN و روش‌های نوین پردازش زبان طبیعی"
prereqs:
  - "تسلط بر پایتون، NumPy و pandas (مطالب دوره‌ی «پایتون برای تحلیل داده» کافی است)"
  - "بخش «مبانی ریاضی» شهود لازم از حسابان و جبر خطی را فراهم می‌کند؛ در صورت تسلط می‌توان از آن گذشت"
tools: ["scikit-learn", "pandas", "NumPy", "PyTorch", "TensorFlow", "Matplotlib"]
modules:
  - t: "مبانی ریاضی یادگیری ماشین"
    l: ["توابع خطی و غیرخطی", "مفهوم حد", "مشتق و یافتن نقاط اکسترمم", "دستگاه معادلات خطی", "بردارها", "جبر ماتریس‌ها", "مجموعه‌ی جواب‌ها و استقلال خطی"]
  - t: "مبانی یادگیری ماشین"
    l: ["چرخه‌ی کار یادگیری ماشین", "آشنایی با الگوریتم K-نزدیک‌ترین همسایه", "ارزیابی عملکرد مدل", "بهینه‌سازی ابرپارامترها", "پروژه‌ی راهنمادار: تشخیص سرطان سینه"]
  - t: "رگرسیون"
    l: ["آشنایی با رگرسیون خطی", "تفسیر پارامترهای رگرسیون", "بررسی برازش رگرسیون خطی", "به‌کارگیری مدل‌های رگرسیون خطی", "درک روش گرادیان کاهشی", "پیاده‌سازی گرادیان کاهشی در پایتون", "گرادیان کاهشی با scikit-learn", "پروژه‌ی راهنمادار: پیش‌بینی هزینه‌های بیمه"]
  - t: "طبقه‌بندی"
    l: ["آشنایی با رگرسیون لجستیک", "تفسیر پارامترهای رگرسیون", "ارزیابی مدل‌های رگرسیون لجستیک", "به‌کارگیری مدل‌های رگرسیون لجستیک", "پروژه‌ی راهنمادار: طبقه‌بندی بیماری قلبی"]
  - t: "درخت‌ها و مدل‌های ترکیبی"
    l: ["مبانی درخت تصمیم", "ساخت درخت تصمیم با scikit-learn", "ارزیابی و بهینه‌سازی درخت تصمیم", "اعتبارسنجی متقابل و روش‌های ترکیبی", "پروژه‌ی راهنمادار: پیش‌بینی بهره‌وری کارکنان"]
  - t: "بهینه‌سازی مدل و ساخت ویژگی"
    l: ["ساخت ویژگی", "انتخاب مدل", "اعتبارسنجی متقابل", "منظم‌سازی (Regularization)", "فراتر از مدل‌های خطی", "پروژه‌ی راهنمادار: بهینه‌سازی پیش‌بینی مدل"]
  - t: "یادگیری بدون نظارت"
    l: ["آشنایی با یادگیری بدون نظارت", "الگوریتم تکراری K-Means", "انتخاب تعداد خوشه‌ها", "برازش و تفسیر K-Means", "پروژه‌ی راهنمادار: بخش‌بندی مشتریان عمده‌فروشی"]
  - t: "مبانی یادگیری عمیق"
    l: ["آشنایی با شبکه‌های عصبی", "مبانی ریاضی و NumPy برای شبکه‌های عصبی", "گرادیان کاهشی در شبکه‌های عصبی", "پس‌انتشار خطا (Backpropagation)", "بهینه‌سازها: SGD، RMSprop و Adam", "منظم‌سازی شبکه‌های عصبی"]
  - t: "یادگیری عمیق با PyTorch"
    l: ["مبانی یادگیری عمیق", "Tensor و مشتق‌گیری خودکار در PyTorch", "ساخت شبکه‌ی عصبی با nn.Sequential", "آموزش شبکه‌های عصبی", "شبکه‌های عمیق و منظم‌سازی", "پروژه‌ی راهنمادار: سود روز اول عرضه‌ی اولیه (IPO)"]
  - t: "یادگیری عمیق با TensorFlow"
    l: ["مبانی یادگیری عمیق", "آشنایی با عملیات TensorFlow", "شبکه‌های کم‌عمق با Sequential API", "مدل‌های یادگیری عمیق چندلایه", "یادگیری عمیق با Functional API در Keras", "پروژه‌ی راهنمادار: پیش‌بینی سود روز اول عرضه‌ی اولیه (IPO)"]
  - t: "بینایی ماشین با CNN"
    l: ["آشنایی با شبکه‌های عصبی کانولوشنی", "معماری CNN", "منظم‌سازی در یادگیری عمیق", "معماری‌های پیشرفته‌ی CNN", "یادگیری انتقالی (Transfer Learning)", "پروژه‌ی راهنمادار: تشخیص ذات‌الریه در تصاویر رادیولوژی"]
  - t: "مدل‌های ترتیبی (RNN و LSTM)"
    l: ["آشنایی با شبکه‌های عصبی بازگشتی", "معماری پایه‌ی RNN", "معماری‌های پیشرفته‌ی RNN: GRU و LSTM", "افزودن لایه‌های کانولوشنی به RNN", "پیش‌بینی سری زمانی با RNN", "پروژه‌ی راهنمادار: پیش‌بینی شاخص S&P 500"]
  - t: "پردازش زبان طبیعی با یادگیری عمیق"
    l: ["آشنایی با پردازش زبان طبیعی", "برداری‌سازی متن و بردارهای واژه (Word Embedding)", "ساخت مدل‌های طبقه‌بندی متن", "ساخت مدل‌های ترتیبی برای متن", "ساخت مدل‌های متنی با ترنسفورمر", "پروژه‌ی راهنمادار: طبقه‌بندی توییت‌های مرتبط با حوادث"]
