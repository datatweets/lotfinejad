# «اصول کاری» on the About page (layouts/about/single.html): title + one-line description,
# rendered in the same card style as the home page's problems section.
title: "اصول کاری"
intro: "اصولی روشن برای تصمیم‌گیری، طراحی و اجرای راهکارهای داده و هوش مصنوعی."
items:
  - title: "اول معیار، بعد راهکار"
    desc: "پیش از آغاز کار، معیارهای موفقیت تعریف می‌شوند تا اثر راهکار قابل سنجش باشد."
  - title: "ساده‌ترین راهکار مؤثر"
    desc: "راهکار متناسب با نیاز انتخاب می‌شود و پیچیدگی تنها زمانی افزوده می‌شود که ارزش مشخصی ایجاد کند."
  - title: "تصمیم‌های مکتوب"
    desc: "تصمیم‌های فنی و دلایل آن‌ها ثبت می‌شوند تا مبنای اجرا، بازبینی و همکاری تیم روشن باشد."
  - title: "هزینه و سرعت، بخشی از کیفیت"
    desc: "هزینه‌ی اجرا و زمان پاسخ‌گویی از ابتدای طراحی سنجیده می‌شوند و در ارزیابی کیفیت راهکار نقش دارند."
