# «اصول کاری» on the About page (layouts/about/single.html): title + one-line description,
# rendered in the same card style as the home page's problems section.
title: "اصول کاری"
intro: "اصولی که در همه‌ی پروژه‌ها، از مشاوره تا اجرا، رعایت می‌شود."
items:
  - title: "اول معیار، بعد راهکار"
    desc: "پیش از هر تغییری مشخص می‌شود که «بهتر شدن» با چه معیاری سنجیده می‌شود تا نتیجه قابل اندازه‌گیری باشد."
  - title: "ساده‌ترین راهکار مؤثر"
    desc: "راهکاری که کار می‌کند زودتر به دست کاربر می‌رسد؛ پیچیدگی فقط وقتی اضافه می‌شود که دلیل روشنی داشته باشد."
  - title: "تصمیم‌های مکتوب"
    desc: "تصمیم‌های فنی و دلایل آن‌ها مکتوب می‌شوند تا اختلاف‌نظرها پیش از اجرا روشن شوند، نه بعد از آن."
  - title: "هزینه و سرعت، بخشی از کیفیت"
    desc: "هزینه‌ی اجرا و سرعت پاسخ‌گویی سامانه از ابتدا در طراحی دیده می‌شود، نه به‌عنوان موضوعی فرعی در پایان کار."
