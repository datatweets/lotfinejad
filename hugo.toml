baseURL = "https://lotfinejad.ir/"
languageCode = "fa-ir"
defaultContentLanguage = "fa"
title = "محمدمهدی لطفی نژاد"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]
summaryLength = 40
# Sitemap lastmod: a page's own lastmod/date (posts), else its last git commit
# (the deploy workflow checks out full history: fetch-depth: 0).
enableGitInfo = true

[frontmatter]
  lastmod = ["lastmod", "date", ":git"]

[sitemap]
  changeFreq = "monthly"
  priority = 0.5

[pagination]
  pagerSize = 8

[params]
  description = "مشاوره، طراحی و اجرای راهکارهای داده و هوش مصنوعی برای سازمان‌ها؛ همراه با آموزش تخصصی تیم‌ها و بیش از ۱۵ سال تجربه در بانکداری، انرژی، مخابرات و فناوری حقوقی."
  author = "محمدمهدی لطفی نژاد"
  headline = "مشاوره و آموزش داده و هوش مصنوعی"
  tagline = "راهکارهای داده و هوش مصنوعی برای سازمان‌ها؛ از برنامه‌ریزی و طراحی تا اجرا و توانمندسازی تیم‌ها."
  email = "lotfinejad@gmail.com"
  domain = "lotfinejad.ir"
  # Lead forms post here (FormSubmit: free, no backend). The first submission
  # sends a one-time activation email to this address; click it once and all
  # later submissions are delivered. After activation FormSubmit also offers a
  # random alias you can use instead of the plain address.
  formEndpoint = "https://formsubmit.co/ajax/lotfinejad@gmail.com"

  about = [
    "محمدمهدی لطفی نژاد مشاور و مدرس داده و هوش مصنوعی است و بیش از ۱۵ سال در مهندسی داده، یادگیری ماشین و مدل‌های زبانی بزرگ تجربه دارد. او پروژه‌های داده و هوش مصنوعی را در سازمان‌هایی مانند CIMB، Petronas، Shell، TNB و Axiata هدایت کرده و سابقه‌ی تدریس و پژوهش دانشگاهی دارد.",
    "خدمات در سه حوزه ارائه می‌شود: مشاوره و طراحی زیرساخت داده و سامانه‌های هوش مصنوعی، اجرای راهکارهای متناسب با نیاز سازمان، و آموزش حضوری یا آنلاین تیم‌های فنی.",
    "در پروژه‌هایی که پایداری دسترسی یا محرمانگی داده اهمیت دارد، امکان استفاده از مدل‌های متن‌باز و اجرای سامانه روی زیرساخت سازمان بررسی می‌شود. دوره‌ها نیز به زبان فارسی و بر اساس نیاز و سطح تیم طراحی می‌شوند."
  ]

  # Cookie-free analytics (Umami). Paste the Website ID from Umami Cloud
  # (cloud.umami.is → Settings → Websites → Edit) to switch it on. Loads only
  # in production builds (hugo, not hugo server) and only for lotfinejad.ir.
  [params.analytics]
    umamiWebsiteId = "79b750c9-0c59-4886-9f0f-ba74462f7798"
    umamiScript = "https://cloud.umami.is/script.js"

[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "RSS", "llms"]
  section = ["HTML", "RSS"]

[markup]
  [markup.highlight]
    style = "github"
    lineNos = false
    codeFences = true
    guessSyntax = true
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true

