slug: python
en: "Python for Data Analytics"
fa: "پایتون برای تحلیل داده"
level: "مقدماتی تا متوسط"
summary: "آموزش پایتون برای تحلیل داده، از مبانی برنامه‌نویسی تا کار با NumPy، pandas و مصورسازی داده."
project: "پروژه‌های عملی تحلیل داده‌های واقعی"
outcomes:
  - "نوشتن برنامه‌های پایتون از پایه: متغیرها، ساختارهای کنترلی، توابع و ساختمان‌های داده"
  - "کار با فایل‌ها، مدیریت خطا و نوشتن کدی تمیز و قابل استفاده‌ی دوباره"
  - "استفاده از آرایه‌های NumPy برای محاسبات عددی سریع به‌جای حلقه‌های دستی"
  - "بارگذاری، پاک‌سازی، فیلتر، گروه‌بندی و ادغام داده‌های واقعی با pandas"
  - "تبدیل نتیجه‌ی تحلیل به نمودارهایی گویا و قابل ارائه"
prereqs:
  - "نیازی به تجربه‌ی برنامه‌نویسی نیست؛ دوره از اولین خط کد شروع می‌شود"
  - "رایانه‌ای که بتوان Python 3 را روی آن نصب کرد"
tools: ["Python 3", "pandas", "NumPy", "Matplotlib"]
modules:
  - t: "مبانی پایتون"
    l: ["برنامه‌نویسی با پایتون", "متغیرها و انواع داده", "حلقه‌ی for و تکرار", "کار با لیست‌ها", "دستورهای شرطی", "دیکشنری‌ها در پایتون", "دیکشنری‌های پیشرفته و جدول‌های فراوانی", "توابع در پایتون", "آرگومان‌های تابع و اشکال‌زدایی", "کار با فایل‌ها", "مدیریت استثناها", "List Comprehension", "توابع Lambda", "توابع filter و map"]
  - t: "پایتون پیشرفته"
    l: ["آشنایی با برنامه‌نویسی شیءگرا", "متدهای کلاس، Propertyها و کپسوله‌سازی", "وراثت و چندریختی", "متدهای ویژه و مدل داده‌ی پایتون", "مفاهیم پیشرفته‌ی توابع", "دکوراتورها و فرابرنامه‌نویسی", "Iteratorها و پروتکل تکرار", "Generatorها و پردازش کم‌مصرف از نظر حافظه", "Context Managerها و مدیریت منابع", "عبارات منظم برای پردازش متن", "مجموعه‌ها و ساختمان‌های داده‌ی پیشرفته", "کار با تاریخ، زمان و منطقه‌ی زمانی", "ماژول‌ها و بسته‌ها", "محیط مجازی و مدیریت وابستگی‌ها"]
  - t: "مبانی NumPy"
    l: ["مبانی NumPy و آرایه‌های یک‌بعدی", "آرایه‌های دوبعدی و کار با داده‌های CSV", "انتخاب و برش داده", "عملیات برداری و محاسبات", "اندیس‌گذاری بولی و فیلتر داده", "تغییر داده و انتساب مقدار"]
  - t: "تحلیل داده با pandas"
    l: ["آشنایی با pandas و Series", "DataFrame و خواندن داده", "انتخاب داده با ‎.loc[]‎", "انتخاب داده با ‎.iloc[]‎", "عملیات روی Series و شمارش مقادیر", "مبانی تاریخ و زمان", "فیلتر بولی در pandas", "مرتب‌سازی و رتبه‌بندی", "افزودن و تغییر ستون‌ها", "توابع apply، map و transform", "مدیریت داده‌های گمشده", "تبدیل نوع داده و پاک‌سازی", "حذف رکوردهای تکراری و مدیریت داده‌های پرت", "کار با داده‌های متنی", "گروه‌بندی و تجمیع با GroupBy", "جدول‌های محوری (Pivot Table)", "الحاق DataFrameها", "ادغام و Join کردن DataFrameها", "MultiIndex و داده‌های سلسله‌مراتبی", "توابع پنجره‌ای و عملیات غلتان", "پروژه‌ی پایانی: تحلیل داده‌ی واقعی"]
  - t: "مصورسازی داده با پایتون"
    l: ["آشنایی با نمودار و دستگاه مختصات", "آشنایی با Matplotlib", "سفارشی‌سازی نمودارها", "چند خط و چند سری در یک نمودار", "مبانی نمودار پراکنش", "رسم نمودار پراکنش", "درک همبستگی", "مقایسه‌ی همبستگی‌ها", "درک توزیع داده", "رسم نمودار میله‌ای", "رسم هیستوگرام", "مقایسه‌ی توزیع‌ها", "متد plot در pandas", "رسم چند نمودار در یک شکل", "نمودارهای شبکه‌ای", "پروژه‌ی پایانی: تحلیل ترافیک"]
