faq:
  - q: "داده‌های سازمان ما هنوز منظم نیست؛ آیا برای شروع زود است؟"
    a: "خیر. بیشتر پروژه‌ها از همین نقطه شروع می‌شوند. در مرحله‌ی بررسی مشخص می‌شود کدام داده‌ها آماده‌اند و پیش از به‌کارگیری هوش مصنوعی چه کارهایی لازم است."
  - q: "بدون دسترسی به سرویس‌های خارجی هم می‌توان از هوش مصنوعی استفاده کرد؟"
    a: "بله. تمرکز بر مدل‌های متن‌باز است که روی سرورهای خود سازمان نصب می‌شوند و به سرویس‌های خارجی وابسته نیستند."
  - q: "هزینه‌ی همکاری چگونه تعیین می‌شود؟"
    a: "هزینه به دامنه‌ی کار، مدت همکاری و منابع لازم بستگی دارد. پس از جلسه‌ی مشاوره و بررسی اولیه، شرح کار، زمان‌بندی و هزینه با شما هماهنگ می‌شود تا پیش از شروع، همه‌چیز روشن باشد."
  - q: "از اطلاعات سازمان ما چگونه محافظت می‌شود؟"
    a: "محرمانگی اطلاعات در همه‌ی مراحل رعایت می‌شود و در صورت نیاز، پیش از شروع کار قرارداد عدم افشای اطلاعات امضا می‌شود."
  - q: "دوره‌های آموزشی به چه شکل برگزار می‌شوند؟"
    a: "دوره‌ها به زبان فارسی و به‌صورت حضوری در محل سازمان یا آنلاین و زنده برگزار می‌شوند. فهرست کامل دوره‌ها در صفحه‌ی «دوره‌ها» آمده است."

closing:
  title: "گام بعدی را با یک گفت‌وگوی تخصصی آغاز کنید"
  text: "برای بررسی نیاز سازمان، برنامه‌ریزی دوره‌ی آموزشی یا ارزیابی یک پروژه، درخواست جلسه‌ی مشاوره را ثبت کنید. درخواست شما بررسی می‌شود و برای هماهنگی زمان جلسه با شما تماس گرفته خواهد شد."
