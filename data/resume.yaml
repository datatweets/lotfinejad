summary: >-
  دانشمند ارشد داده، مهندس داده و هوش مصنوعی و مدرس سازمانی دارای اعتبارنامه‌ی HRDC، با بیش از
  ۱۵ سال تجربه در طراحی پلتفرم‌های داده، ساخت راهکارهای تحلیلی و یادگیری ماشین و برگزاری دوره‌های
  فنی سازمانی. حوزه‌های تخصصی شامل علم داده، مهندسی داده، کاربردهای مدل‌های زبانی بزرگ، پلتفرم‌های
  داده‌ی ابری و سامانه‌های RAG و ایجنتیک مبتنی بر LangChain و LangGraph است؛ همراه با تسلط بر
  DevOps، DataOps، MLOps، Kubernetes، Terraform و observability برای پایداری سامانه‌های داده و
  هوش مصنوعی در محیط تولید.

