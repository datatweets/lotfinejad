slug: statistics
en: "Statistics & Probability"
fa: "آمار و احتمال"
level: "مقدماتی تا متوسط"
summary: "آموزش آمار و احتمال از پایه: نمونه‌گیری، توزیع‌ها، میانگین‌ها، احتمال، قضیه‌ی بیز و آزمون فرض، همراه با تمرین عملی در پایتون روی داده‌های واقعی."
project: "تحلیل‌های عملی روی مجموعه‌داده‌های واقعی"
outcomes:
  - "توصیف درست یک مجموعه‌داده با شاخص‌های مناسب مرکزی و پراکندگی"
  - "استدلال درباره‌ی احتمال، استقلال و احتمال شرطی"
  - "به‌کارگیری قضیه‌ی بیز برای به‌روزرسانی باورها با رسیدن شواهد جدید"
  - "نتیجه‌گیری از نمونه و بیان میزان اطمینان قابل‌قبول به آن نتیجه"
prereqs:
  - "تسلط مقدماتی بر پایتون؛ محاسبات با کد انجام می‌شود نه به‌صورت دستی"
  - "جبر در سطح دبیرستان؛ نیازی به حسابان نیست"
tools: ["Python 3", "pandas", "NumPy", "SciPy"]
modules:
  - t: "مبانی آمار"
    l: ["جامعه و نمونه", "متغیرها و مقیاس‌های اندازه‌گیری", "توزیع فراوانی", "مصورسازی توزیع‌ها", "مقایسه‌ی توزیع‌ها", "پروژه‌ی راهنمادار: تشخیص گونه‌ها از یکدیگر"]
  - t: "شاخص‌های مرکزی و پراکندگی"
    l: ["میانگین", "میانگین وزنی و میانه", "مُد", "شاخص‌های پراکندگی", "نمره‌ی Z", "پروژه‌ی راهنمادار: بررسی مصرف سوخت خودروها"]
  - t: "مبانی احتمال"
    l: ["برآورد احتمال", "قواعد احتمال", "حل مسائل پیچیده‌ی احتمال", "جایگشت و ترکیب", "پروژه‌ی راهنمادار: شانس برنده‌شدن در قرعه‌کشی"]
  - t: "احتمال شرطی و قضیه‌ی بیز"
    l: ["مبانی احتمال شرطی", "احتمال شرطی: سطح متوسط", "قضیه‌ی بیز", "الگوریتم بیز ساده (Naive Bayes)", "پروژه‌ی راهنمادار: ساخت تشخیص‌دهنده‌ی عناوین فریبنده"]
  - t: "استنباط آماری"
    l: ["توزیع نمونه‌گیری و بازه‌ی اطمینان", "آزمون فرض", "آزمون نیکویی برازش کای‌دو", "آزمون استقلال کای‌دو", "پروژه‌ی راهنمادار: مقایسه‌ی خودروهای ژاپنی و آمریکایی"]
