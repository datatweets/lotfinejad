executive:
  label: "ویژه‌ی مدیران"
  title: "اجرای هوش مصنوعی ایجنتیک در سازمان"
  desc: >-
    برنامه‌ای برای مدیران و تصمیم‌گیران که می‌خواهند هوش مصنوعی ایجنتیک را در فرایندهای سازمان
    به کار بگیرند: انتخاب فرایند مناسب، تعیین وضعیت فعلی و معیار موفقیت، برآورد هزینه،
    ملاحظات امنیتی و حاکمیتی، و طراحی برنامه‌ای مرحله‌به‌مرحله و قابل‌ارزیابی برای اجرا.

steps:
  - title: "نیازسنجی"
    desc: "شناخت شرکت‌کنندگان، سطح فعلی، ابزارهای تیم و نتیجه‌ای که سازمان انتظار دارد."
  - title: "طراحی دوره"
    desc: "تعیین سرفصل، مدت، پیش‌نیازها و تمرین‌ها، متناسب با کار واقعی تیم."
  - title: "برگزاری"
    desc: "کلاس تعاملی، تمرین عملی، پاسخ به پرسش‌ها و تنظیم سرعت آموزش با گروه."
  - title: "تمرین و پیگیری"
    desc: "تحویل جزوه‌ها و تمرین‌ها و ارائه‌ی مسیر روشن برای ادامه‌ی یادگیری."

outcomes:
  - "آموزش کاملاً فارسی، همراه با اصطلاحات تخصصی رایج"
  - "تمرین روی داده و نمونه‌هایی نزدیک به کار سازمان"
  - "جزوه، کد و تمرین‌ها برای مرور پس از دوره"
  - "پروژه‌ی عملی در دوره‌های جامع"
  - "گواهی حضور برای شرکت‌کنندگان، در صورت درخواست"
  - "امکان صدور فاکتور رسمی برای سازمان‌ها"

faq:
  - q: "دوره‌ها حضوری برگزار می‌شوند یا آنلاین؟"
    a: "هر دو. دوره می‌تواند حضوری در محل سازمان شما یا به‌صورت آنلاین و زنده برگزار شود. زمان، مکان و شیوه‌ی برگزاری پیش از شروع هماهنگ می‌شود."
  - q: "آیا سرفصل دوره قابل تغییر است؟"
    a: "بله. سرفصل‌ها نقطه‌ی شروع هستند؛ موضوعات، سطح، مثال‌ها و تمرین‌ها بر اساس ابزارها و نیاز تیم شما تنظیم می‌شوند."
  - q: "هزینه‌ی دوره چگونه تعیین می‌شود؟"
    a: "هزینه به موضوع، مدت دوره، تعداد شرکت‌کنندگان و شیوه‌ی برگزاری بستگی دارد. پس از دریافت این اطلاعات و نیازسنجی، برنامه و هزینه‌ی دوره با شما هماهنگ می‌شود."
  - q: "برای هر دوره چند نفر مناسب است؟"
    a: "دوره‌ها برای گروه‌های کوچک تا یک واحد کامل سازمانی قابل برگزاری‌اند. برای حفظ کیفیت تمرین‌ها، تعداد شرکت‌کنندگان در طراحی دوره در نظر گرفته می‌شود."
  - q: "آیا می‌توان از داده‌های خود سازمان در تمرین‌ها استفاده کرد؟"
    a: "بله، به شرط آنکه پیش از شروع درباره‌ی محرمانگی، سطح دسترسی و آماده‌سازی داده توافق شود."
  - q: "پیش از درخواست، چه اطلاعاتی لازم است؟"
    a: "موضوع دوره، تعداد و سطح شرکت‌کنندگان، زمان و شیوه‌ی برگزاری مدنظر، و آنچه انتظار دارید تیم پس از دوره بتواند انجام دهد."

