{{- /* Closing call-to-action shared by every page; copy from data/home.yaml. */ -}}
{{ $c := site.Data.home.closing }}
<section class="h-sec">
  <div class="h-end">
    <div>
      <h2>{{ $c.title }}</h2>
      <p>{{ $c.text }}</p>
    </div>
    <div class="h-end-actions">
      <a class="btn btn-gold" href="{{ "contact/" | relLangURL }}">{{ partial "icon.html" "mail" }}درخواست جلسه‌ی آشنایی</a>
      <a class="h-mail lat" href="mailto:{{ site.Params.email }}">{{ site.Params.email }}</a>
    </div>
  </div>
</section>
