executive:
  label: "ویژه‌ی مدیران"
  title: "اجرای هوش مصنوعی ایجنتیک در سازمان"
  desc: >-
    برنامه‌ای برای مدیران و تصمیم‌گیران سازمانی، با تمرکز بر انتخاب فرایند مناسب، تعیین وضعیت فعلی
    و معیار موفقیت، برآورد هزینه، ملاحظات امنیتی و حاکمیتی، و طراحی نقشه‌ی اجرای مرحله‌ای و قابل‌ارزیابی.

steps:
  - title: "نیازسنجی"
    desc: "بررسی سطح شرکت‌کنندگان، ابزارهای مورد استفاده و هدف آموزشی سازمان."
  - title: "طراحی دوره"
    desc: "تعیین سرفصل، مدت، پیش‌نیازها و تمرین‌ها بر اساس نیازهای کاری تیم."
  - title: "برگزاری"
    desc: "ارائه‌ی تعاملی، تمرین عملی، پاسخ به پرسش‌ها و تنظیم روند آموزش با سطح گروه."
  - title: "تمرین و پیگیری"
    desc: "ارائه‌ی جزوه و تمرین‌ها، همراه با پیشنهاد مسیر ادامه‌ی یادگیری."

outcomes:
  - "آموزش کاملاً فارسی، همراه با اصطلاحات تخصصی رایج"
  - "تمرین روی داده و نمونه‌هایی نزدیک به کار سازمان"
  - "جزوه، کد و تمرین‌ها برای مرور پس از دوره"
  - "پروژه‌ی عملی در دوره‌های جامع"
  - "گواهی حضور برای شرکت‌کنندگان، در صورت درخواست"
  - "امکان صدور فاکتور رسمی برای سازمان‌ها"

faq:
  - q: "دوره‌ها حضوری برگزار می‌شوند یا آنلاین؟"
    a: "دوره‌ها به‌صورت حضوری در محل سازمان یا آنلاین و زنده برگزار می‌شوند. زمان و شیوه‌ی برگزاری پیش از آغاز دوره هماهنگ خواهد شد."
  - q: "آیا سرفصل دوره قابل تغییر است؟"
    a: "بله. موضوع‌ها، سطح، مثال‌ها و تمرین‌ها بر اساس ابزارها و نیاز تیم سازمان تنظیم می‌شوند."
  - q: "هزینه‌ی دوره چگونه تعیین می‌شود؟"
    a: "هزینه بر اساس موضوع، مدت دوره، شمار شرکت‌کنندگان و شیوه‌ی برگزاری تعیین می‌شود. پس از نیازسنجی، برنامه و برآورد هزینه ارائه خواهد شد."
  - q: "برای هر دوره چند نفر مناسب است؟"
    a: "دوره‌ها برای گروه‌های کوچک یا واحدهای سازمانی برگزار می‌شوند. شمار شرکت‌کنندگان در طراحی تمرین‌ها و شیوه‌ی آموزش لحاظ می‌شود."
  - q: "آیا می‌توان از داده‌های خود سازمان در تمرین‌ها استفاده کرد؟"
    a: "بله. استفاده از داده‌ی سازمان پس از توافق درباره‌ی محرمانگی، سطح دسترسی و آماده‌سازی داده انجام می‌شود."
  - q: "پیش از درخواست، چه اطلاعاتی لازم است؟"
    a: "موضوع دوره، شمار و سطح شرکت‌کنندگان، زمان‌بندی و شیوه‌ی برگزاری، و توانمندی مورد انتظار پس از پایان دوره را مشخص کنید."

