# Consultation page (layouts/consultation/single.html).
eyebrow: "درخواست مشاوره"
title: "جلسه‌ی مشاوره رایگان ۲۰ دقیقه‌ای"
lead: >-
  در جلسه‌ی ۲۰ دقیقه‌ای، نیاز و شرایط سازمان بررسی می‌شود تا مسیر مناسب، از مشاوره و اجرای پروژه
  تا آموزش تیم، روشن شود. فرم زیر را تکمیل کنید تا برای هماهنگی زمان جلسه با شما تماس گرفته شود.

topics:
  title: "موضوع‌های جلسه"
  items:
    - "وضعیت فعلی داده و فناوری در سازمان"
    - "اهداف و مسئله‌ای که باید حل شود"
    - "بهترین مسیر: مشاوره، اجرای پروژه یا آموزش تیم"
    - "زمان‌بندی، منابع و گام بعدی"

fit:
  title: "این جلسه برای چه کسانی مناسب است"
  items:
    - title: "مدیران و تصمیم‌گیران"
      desc: "برای شناسایی کاربردهای ارزش‌آفرین هوش مصنوعی و تعیین گام‌های آغازین."
    - title: "مدیران فناوری و داده"
      desc: "برای ارزیابی زیرساخت داده یا برنامه‌ریزی عملیاتی‌سازی سامانه‌های هوش مصنوعی."
    - title: "مسئولان آموزش و منابع انسانی"
      desc: "برای طراحی دوره‌ی حضوری یا آنلاین داده و هوش مصنوعی متناسب با نیاز تیم فنی."

faq:
  - q: "آیا برای جلسه‌ی مشاوره هزینه‌ای دریافت می‌شود؟"
    a: "خیر. جلسه‌ی آغازین ۲۰ دقیقه‌ای رایگان است و تعهدی برای ادامه‌ی همکاری ایجاد نمی‌کند. هزینه‌ی همکاری احتمالی، پس از توافق درباره‌ی دامنه‌ی کار، مشخص خواهد شد."
  - q: "جلسه به چه شکل برگزار می‌شود؟"
    a: "جلسه به‌صورت آنلاین (تماس تصویری یا تلفنی) برگزار می‌شود. زمان آن پس از بررسی درخواست با شما هماهنگ می‌شود."
  - q: "اطلاعاتی که در فرم می‌نویسم محرمانه می‌ماند؟"
    a: "بله. اطلاعات فرم فقط برای پاسخ به درخواست شما استفاده می‌شود و در اختیار هیچ شخص یا سازمان دیگری قرار نمی‌گیرد."
  - q: "اگر هنوز دقیقاً نمی‌دانم به چه چیزی نیاز دارم چه کنم؟"
    a: "در فرم، گزینه‌ی «هنوز مشخص نیست» را انتخاب و وضعیت فعلی را به‌اختصار شرح دهید. تعیین مسیر مناسب در جلسه انجام می‌شود."
