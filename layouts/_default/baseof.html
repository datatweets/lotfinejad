<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <script>
    /* Apply a saved theme choice before first paint, so there's no flash
       of the wrong theme. Falls back to the OS preference via CSS alone. */
    try {
      var t = localStorage.getItem('lnj-theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  {{ partial "head.html" . }}
</head>
<body>
  <div class="progress" id="progress"></div>
  {{ partial "header.html" . }}
  <main id="view">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ with resources.Get "js/app.js" }}
    {{ $js := . | minify | fingerprint }}
    <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer
      data-is-article="{{ if eq $.Type "posts" }}{{ if not $.IsSection }}1{{ end }}{{ end }}"></script>
  {{ end }}
</body>
</html>
