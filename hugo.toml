baseURL = "https://lotfinejad.ir/"
languageCode = "fa-ir"
defaultContentLanguage = "fa"
title = "محمدمهدی لطفی‌نژاد"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]
summaryLength = 40
# Sitemap lastmod: a page's own lastmod/date (posts), else its last git commit
# (the deploy workflow checks out full history: fetch-depth: 0).
enableGitInfo = true

[frontmatter]
  lastmod = ["lastmod", "date", ":git"]

[sitemap]
  changeFreq = "monthly"
  priority = 0.5

[pagination]
  pagerSize = 8

[params]
  description = "محمدمهدی لطفی‌نژاد، مشاور و مدرس داده و هوش مصنوعی: مشاوره، اجرای پروژه و برگزاری دوره‌های جامع حضوری و آنلاین برای سازمان‌ها."
  author = "محمدمهدی لطفی‌نژاد"
  headline = "مشاور و مدرس داده و هوش مصنوعی"
  tagline = "مشاوره، اجرای پروژه و برگزاری دوره‌های آموزشی داده و هوش مصنوعی برای سازمان‌ها."
  email = "lotfinejad@gmail.com"
  domain = "lotfinejad.ir"
  # Lead forms post here (FormSubmit: free, no backend). The first submission
  # sends a one-time activation email to this address; click it once and all
  # later submissions are delivered. After activation FormSubmit also offers a
  # random alias you can use instead of the plain address.
  formEndpoint = "https://formsubmit.co/ajax/lotfinejad@gmail.com"

  about = [
    "محمدمهدی لطفی‌نژاد مشاور و مدرس داده و هوش مصنوعی است و بیش از پانزده سال در زمینه‌ی مهندسی داده، یادگیری ماشین و مدل‌های زبانی بزرگ سابقه دارد. او پروژه‌های داده و هوش مصنوعی را برای سازمان‌هایی مانند بانک CIMB، Petronas، Shell، TNB و Axiata هدایت کرده و سال‌ها نیز در دانشگاه تدریس و پژوهش کرده است.",
    "کار او سه بخش اصلی دارد: مشاوره در طراحی و اجرای زیرساخت داده و سامانه‌های هوش مصنوعی، برگزاری دوره‌های جامع حضوری و آنلاین برای تیم‌های فنی، و ساخت راهکارهای هوش مصنوعی که مستقیماً در کار روزانه‌ی سازمان به کار گرفته می‌شوند.",
    "از آنجا که دسترسی به سرویس‌های هوش مصنوعی خارجی همیشه پایدار نیست، تمرکز این همکاری‌ها بر مدل‌های متن‌باز و راهکارهایی است که روی سرورهای خود سازمان اجرا می‌شوند. دوره‌های آموزشی نیز کاملاً به زبان فارسی و متناسب با شرایط واقعی سازمان‌های داخل کشور طراحی می‌شوند."
  ]

  # Cookie-free analytics (Umami). Paste the Website ID from Umami Cloud
  # (cloud.umami.is → Settings → Websites → Edit) to switch it on. Loads only
  # in production builds (hugo, not hugo server) and only for lotfinejad.ir.
  [params.analytics]
    umamiWebsiteId = "79b750c9-0c59-4886-9f0f-ba74462f7798"
    umamiScript = "https://cloud.umami.is/script.js"

[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "RSS", "llms"]
  section = ["HTML", "RSS"]

[markup]
  [markup.highlight]
    style = "github"
    lineNos = false
    codeFences = true
    guessSyntax = true
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true

