eyebrow: "آموزش سازمانی"
title: "دوره‌های جامع داده و هوش مصنوعی، به‌صورت حضوری و آنلاین"
lead: >-
  دوره‌های کاربردی برای تیم‌ها و سازمان‌ها؛ از مبانی تحلیل داده تا ساخت سامانه‌های هوش مصنوعی.
  سرفصل، سطح و تمرین‌های هر دوره بر اساس نیاز تیم شما تنظیم می‌شود و آموزش کاملاً به زبان فارسی است.

