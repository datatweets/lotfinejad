slug: sql-server
en: "SQL Server Database Management & T-SQL"
fa: "مدیریت پایگاه داده با SQL Server و T-SQL"
level: "متوسط تا پیشرفته"
hours: 24
summary: "آموزش مدیریت و بهینه‌سازی پایگاه داده در SQL Server؛ از طراحی مدل و نوشتن T-SQL تا ایندکس‌گذاری، امنیت، پشتیبان‌گیری و عیب‌یابی عملکرد."
project: "طراحی و پیاده‌سازی یک پایگاه داده‌ی گزارش‌گیری با رویه‌های نگهداری و پشتیبان‌گیری"
outcomes:
  - "طراحی جداول رابطه‌ای، کلیدها و محدودیت‌ها برای حفظ یکپارچگی داده"
  - "نوشتن کوئری‌های T-SQL با Join، CTE، توابع پنجره‌ای و رویه‌های ذخیره‌شده"
  - "تحلیل Execution Plan و انتخاب ایندکس برای بهبود کارایی کوئری"
  - "مدیریت تراکنش‌ها، دسترسی کاربران و مجوزهای پایگاه داده"
  - "اجرای راهبردهای پشتیبان‌گیری، بازیابی و نگهداری پایگاه داده"
prereqs:
  - "آشنایی مقدماتی با پایگاه داده و مفاهیم جدول، ستون و رابطه"
  - "آشنایی پایه با SQL مفید است؛ مفاهیم ضروری در ابتدای دوره مرور می‌شوند"
tools: ["Microsoft SQL Server", "SQL Server Management Studio", "T-SQL"]
modules:
  - t: "ساختار و طراحی پایگاه داده"
    l: ["معماری SQL Server و اجزای پایگاه داده", "طراحی جدول و انتخاب نوع داده", "کلید اصلی و خارجی و محدودیت‌ها", "نرمال‌سازی و طراحی مدل رابطه‌ای", "پروژه‌ی راهنمادار: طراحی پایگاه داده‌ی فروش"]
  - t: "کوئری‌نویسی با T-SQL"
    l: ["SELECT، فیلتر و مرتب‌سازی", "تجمیع و GROUP BY", "انواع Join و ترکیب جدول‌ها", "زیرکوئری و CTE", "توابع پنجره‌ای برای تحلیل داده", "پروژه‌ی راهنمادار: ساخت گزارش مدیریتی"]
  - t: "برنامه‌نویسی و تراکنش‌ها"
    l: ["متغیرها و کنترل جریان در T-SQL", "ساخت و استفاده از View", "رویه‌های ذخیره‌شده و پارامترها", "مدیریت خطا و تراکنش‌ها", "اصول ACID و کنترل هم‌زمانی"]
  - t: "کارایی و عیب‌یابی"
    l: ["خواندن Execution Plan", "مبانی ایندکس خوشه‌ای و غیرخوشه‌ای", "تشخیص کوئری‌های کند", "آمار و نگهداری ایندکس", "پروژه‌ی راهنمادار: بهینه‌سازی یک گزارش کند"]
  - t: "امنیت و نگهداری"
    l: ["Login، User، Role و مجوزها", "اصل حداقل دسترسی", "تهیه‌ی نسخه‌ی پشتیبان", "بازیابی پایگاه داده و مدل‌های Recovery", "برنامه‌ی نگهداری و ثبت رویداد"]
