slug: pyspark-for-data-engineering
en: "PySpark for Data Engineering"
fa: "پردازش کلان‌داده با PySpark"
level: "متوسط"
summary: "یادگیری عملی Apache Spark روی رایانه‌ی شخصی: منطق Spark در Driver، Executor و طرح‌های اجرای Lazy؛ DataFrame و Spark SQL روی ده میلیون سفر واقعی تاکسی؛ طرح اجرا، پارتیشن، Shuffle و کش؛ و یک جریان ETL در قالب محیط عملیاتی با Schema، کنترل کیفیت و ثبت رویداد."
project: "جریان کامل ETL با Spark روی داده‌های واقعی تاکسی نیویورک"
outcomes:
  - "توضیح نقش واقعی Driver، Executor و طرح اجرای Lazy"
  - "کار با DataFrame و Spark SQL روی ده میلیون رکورد واقعی"
  - "خواندن طرح اجرا و کنترل پارتیشن‌ها، Shuffle و کش"
  - "ساخت جریان ETL در قالب محیط عملیاتی با کنترل کیفیت و ثبت رویداد"
prereqs:
  - "تسلط بر پایتون و pandas"
  - "بهتر است پس از دوره‌ی «پایتون مقیاس‌پذیر برای مهندسی داده» گذرانده شود"
  - "رایانه‌ای که بتواند Spark را به‌صورت محلی اجرا کند؛ نیازی به خوشه یا حساب ابری نیست"
tools: ["PySpark (حالت محلی)", "pandas", "PyArrow"]
modules:
  - t: "چرا پردازش توزیع‌شده؟"
    l: ["سقف توان یک رایانه", "Driver، Executor و حالت محلی", "اولین SparkSession", "Spark چه زمانی برتری دارد (و چه زمانی نه)", "پروژه‌ی راهنمادار: داده‌ی یک فصل در Spark"]
  - t: "SparkSession، RDD و ارزیابی Lazy"
    l: ["تبدیل‌ها در برابر اقدام‌ها", "RDD در لایه‌های زیرین", "گراف DAG: Job، Stage و Task", "تغییرناپذیری و تبارنامه‌ی داده", "پروژه‌ی راهنمادار: ردگیری کامل یک Job"]
  - t: "DataFrame و تبدیل‌ها"
    l: ["ستون‌ها و عبارت‌ها", "فیلتر و پاک‌سازی", "Join", "گروه‌بندی و تجمیع", "پروژه‌ی راهنمادار: گزارش منطقه–ساعت در Spark"]
  - t: "Spark SQL و طرح اجرا"
    l: ["View موقت و SQL", "خواندن خروجی ‎.explain()‎", "بهینه‌سازی‌های Catalyst", "توابع تعریف‌شده‌ی کاربر و هزینه‌ی آن‌ها", "پروژه‌ی راهنمادار: بهینه‌سازی یک کوئری کند"]
  - t: "پارتیشن، Shuffle و کش"
    l: ["پارتیشن‌ها", "تبدیل‌های باریک و پهن: Shuffle", "کش و ماندگاری", "عدم توازن داده و کارهای عقب‌مانده", "پروژه‌ی راهنمادار: بهینه‌سازی Job منطقه–ساعت"]
  - t: "ساخت جریان ETL در Spark"
    l: ["Schemaها", "خواندن ← پاک‌سازی ← تبدیل", "نوشتن نتایج", "Jobهای تکرارپذیر بدون اثر جانبی", "پروژه‌ی راهنمادار: ETL فصلی"]
  - t: "کیفیت داده و ثبت رویداد"
    l: ["قواعد اعتبارسنجی", "الگوهای قرنطینه‌ی داده", "ثبت ساختاریافته‌ی رویدادها", "شکست آشکار و به‌موقع", "پروژه‌ی راهنمادار: اجرای ETL همراه با کنترل کیفیت"]
  - t: "پروژه‌ی پایانی"
    l: ["پروژه‌ی پایانی: جریان Spark عملیاتی شرکت CityFlow"]
