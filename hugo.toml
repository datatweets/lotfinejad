baseURL = "https://lotfinejad.ir/"
languageCode = "fa-ir"
defaultContentLanguage = "fa"
title = "لطفی‌نژاد"
enableRobotsTXT = true
summaryLength = 40

[pagination]
  pagerSize = 8

[params]
  description = "وب‌سایت شخصی مهدی لطفی‌نژاد — مهندسی داده، هوش مصنوعی و رهبری فنی."
  author = "مهدی لطفی‌نژاد"
  brand = "لطفی‌نژاد"
  brandMark = "ل"
  monoInitial = "م.ل"
  headline = "دانشمند ارشد داده · مهندسی داده و هوش مصنوعی"
  tagline = "درباره‌ی پروژه‌ها، تجربه‌ها و یادداشت‌های خودم می‌نویسم."
  email = "you@lotfinejad.ir"  # TODO: replace with your real email
  coverTag = "Data & AI"
  direction = "rtl"
  githubUser = "datatweets"
  avatarImage = "/images/avatar.jpg"

  about = [
    "من در حوزه‌ی Data & AI فعالیت می‌کنم: پلتفرم‌های داده می‌سازم، سیستم‌های مبتنی بر مدل‌های زبانی را به محصول قابل‌اتکا تبدیل می‌کنم و تیم‌های فنی را در تصمیم‌های معماری همراهی می‌کنم.",
    "این‌جا چیزهایی را می‌نویسم که در مسیر ساخت این سیستم‌ها یاد گرفته‌ام؛ تصمیم‌های مهندسی، بده‌بستان‌هایی که ناچار شدم بپذیرم، و مهارت‌هایی که بازار کار امروز واقعاً از یک مهندس هوش مصنوعی می‌خواهد. هرچه می‌نویسم از کار روی داده‌ی واقعی و تیم واقعی درآمده، نه از خلاصه‌ی کتاب‌ها."
  ]

  howIWork = [
    "اول سنجه، بعد مدل. تا وقتی معلوم نیست «بهتر» را چطور اندازه می‌گیریم، هیچ تغییری بهبود نیست.",
    "ساده‌ترین چیزی که کار می‌کند را منتشر کن، بعد پیچیدگی را با دلیل اضافه کن.",
    "تصمیم را بنویس؛ نوشتن، اختلاف‌های پنهان را قبل از پیاده‌سازی بیرون می‌کشد.",
    "هزینه و تأخیر هم بخشی از کیفیت‌اند، نه یادداشت پایانی."
  ]

[taxonomies]
  tag = "tags"
  category = "categories"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[markup]
  [markup.highlight]
    style = "github"
    lineNos = false
    codeFences = true
    guessSyntax = true
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true

