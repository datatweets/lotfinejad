baseURL = "https://lotfinejad.ir/"
languageCode = "fa-ir"
defaultContentLanguage = "fa"
title = "محمدمهدی لطفی‌نژاد"
enableRobotsTXT = true
summaryLength = 40

[pagination]
  pagerSize = 8

[params]
  description = "محمدمهدی لطفی‌نژاد، مشاور و متخصص داده و هوش مصنوعی: راهبرد، معماری پلتفرم داده، پیاده‌سازی هوش مصنوعی مولد و آموزش تیم‌های فنی سازمان‌ها."
  author = "محمدمهدی لطفی‌نژاد"
  brand = "لطفی‌نژاد"
  brandMark = "ل"
  monoInitial = "م.ل"
  headline = "مشاور و متخصص داده و هوش مصنوعی"
  tagline = "درباره‌ی پروژه‌ها، تجربه‌ها و یادداشت‌های خودم می‌نویسم."
  email = "lotfinejad@gmail.com"
  coverTag = "Data & AI"
  direction = "rtl"
  githubUser = "datatweets"
  avatarImage = "/images/avatar.jpg"

  about = [
    "به کسب‌وکارها و تیم‌های فنی در سه حوزه کمک می‌کنم: مشاوره در طراحی و پیاده‌سازی پلتفرم‌های داده و هوش مصنوعی، آموزش تیم‌های مهندسی برای کار واقعی با مدل‌های زبانی بزرگ و RAG، و ساخت راهکارهای مبتنی بر هوش مصنوعی که مستقیم وارد محصول می‌شوند.",
    "این کار را با نگاه به بازار ایران انجام می‌دهم: چون دسترسی به سرویس‌های ابری هوش مصنوعی خارجی همیشه پایدار نیست، بیشتر روی مدل‌های متن‌باز و زیرساخت خوداستقرار (self-hosted) تمرکز می‌کنم، و آموزش‌ها را کاملاً به فارسی و متناسب با شرایط واقعی تیم‌های داخل ایران طراحی می‌کنم."
  ]

  howIWork = [
    "اول سنجه، بعد مدل. تا وقتی معلوم نیست «بهتر» را چطور اندازه می‌گیریم، هیچ تغییری بهبود نیست.",
    "ساده‌ترین چیزی که کار می‌کند را منتشر کن، بعد پیچیدگی را با دلیل اضافه کن.",
    "تصمیم را بنویس؛ نوشتن، اختلاف‌های پنهان را قبل از پیاده‌سازی بیرون می‌کشد.",
    "هزینه و تأخیر هم بخشی از کیفیت‌اند، نه یادداشت پایانی."
  ]

[taxonomies]
  tag = "tags"
  category = "categories"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[markup]
  [markup.highlight]
    style = "github"
    lineNos = false
    codeFences = true
    guessSyntax = true
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true

