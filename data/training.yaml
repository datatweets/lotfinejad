formats:
  - icon: "people"
    title: "حضوری در محل سازمان"
    desc: "برگزاری در محل سازمان، همراه با تمرین روی ابزارها و نمونه‌های مرتبط با کار تیم. زمان و مکان با هماهنگی تعیین می‌شود."
  - icon: "cpu"
    title: "آنلاین و زنده"
    desc: "کلاس تعاملی آنلاین همراه با پرسش و پاسخ، تمرین گروهی و بازخورد مستقیم؛ مناسب تیم‌های دورکار یا پراکنده در چند شهر."
  - icon: "grid"
    title: "کارگاه کوتاه یا دوره‌ی جامع"
    desc: "از کارگاه یک‌روزه برای یک موضوع مشخص تا برنامه‌ی چندماهه برای آماده‌سازی تیم در یک مسیر تخصصی."

paths:
  title: "دوره‌های جامع مسیر شغلی"
  intro: "مسیرهای آموزشی برای آماده‌سازی نیروها در نقش‌های تخصصی طراحی شده‌اند. مدت هر مسیر بر اساس سطح شرکت‌کنندگان و برنامه‌ی سازمان تعیین می‌شود."
  items:
    - title: "تحلیلگر داده"
      en: "Data Analyst"
      level: "مقدماتی تا متوسط"
      desc: "کار با پایتون و Pandas، پاک‌سازی و تحلیل اکتشافی داده، و ارائه‌ی یافته‌ها با نمودارهای روشن برای مدیران."
    - title: "دانشمند داده"
      en: "Data Scientist"
      level: "مقدماتی تا متوسط"
      desc: "پایتون، آمار و احتمال، آزمون A/B و یادگیری ماشین؛ از تعریف مسئله‌ی کسب‌وکار تا ارزیابی مدل."
    - title: "مهندس یادگیری ماشین"
      en: "Machine Learning Engineer"
      level: "مقدماتی تا پیشرفته"
      desc: "توسعه‌ی مهارت در الگوریتم‌های یادگیری ماشین، یادگیری عمیق، بینایی ماشین و پردازش زبان طبیعی."
    - title: "مهندس داده"
      en: "Data Engineer"
      level: "مقدماتی تا متوسط"
      desc: "پردازش داده‌های حجیم با Spark، Docker و Kubernetes، و طراحی جریان‌های داده با Airflow، Kafka و dbt."
    - title: "مهندس هوش مصنوعی"
      en: "AI Engineer"
      level: "متوسط تا پیشرفته"
      desc: "کار با مدل‌های زبانی بزرگ، طراحی پرامپت، جست‌وجوی معنایی و RAG، توسعه‌ی ایجنت و استقرار سامانه."

